  body:
    -
      value: '<p>&quot;Sometimes a civilization has got to be rescued -- whether it wants to or not!&quot; White borrowed this premise, with permission, from Arthur C. Clarke&#039;s classic novelette, &#039;Rescue Party&#039; (Astounding, May 1946). Captian Spence reflects upon the &quot;knight in shining armour&quot; emotional state of Harrison, a rookie crew member: &quot;The captain had felt that way when he was a new boy. Somehow, the feeling never quite wore off. It came of belonging to an organization dedicated to the job of protecting, assisting, and keeping the noses clean generally of every race in the galaxy that walked, wriggled, or flew and had intelligence.&quot; The Force -- take that, George Lucas! -- is a precursor of the altruistic Monitor Corps that runs Sector General.</p>'
      format: basic_html
