  body:
    -
      value: '<p>‘Accident’ probably wasn’t Jim’s version of those superhero ‘secret origin’ stories that mase Superman DC National Comics what they were thirty-five years ago – but that’s how I choose to see it. Grawlya –Ki and MacEwan, of ‘Tableau’ fame, have been revivified two centuries later. Since then, these “only two entities in the whole Federation with direct experience of war, had grown increasingly monomaniacal on the subject until the honour and rspect accorded them had gradually changed to reactions of impatience and embarrassment0.” Then a ground-transporter accident at the Nidia spaceport gives them the Big Idea that would mature into Sector Twelve General Hospital.</p>'
