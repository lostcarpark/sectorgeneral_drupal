  body:
    -
      value: '<p>&quot;On Sammaradva there are three levels of persons - serviles, warriors, and rulers - and three levels of healers to care for them...&quot; (p29). Cha Thrat, the latest trainee nurse at Sector General describing her home world. Despite being one of the hospital&#039;s most diligent pupils, Cha Thrat is such a magnet for trouble that even Minnie the Minx pales by comparison. White started using the neutral pronoun &#039;it&#039; for all his (its?) Sector General characters, which often led to unnecessary gender confusion. Bull-/cow-shit. I follow Dr Johnson&#039;s wise precept that the male form of a word stands for both male and female. Or, if you prefer, the female form..., etc. Clarity is what matters, and PC grammarians be damned!</p>'
      format: basic_html
      summary: 'Sector General book seven. Introduces some new characters.'
