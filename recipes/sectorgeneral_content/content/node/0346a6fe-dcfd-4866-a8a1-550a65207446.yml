  body:
    -
      value: '<p>As George Orwell once wrote about Charles Dickens: ‘. . . you can only create if you can care” (from The Lion and the Unicorn, 1941). James White really did care about ‘The Housesitter’ – his last short story, and one of his very best. It also undercuts those critics who have condemned his work for showing too much sentiment and not enough strength. Jim tried to exorcize the most awful hurt any parent can suffer with a sympathetic word-spell. The stronger the sunshine, the deeper the shadows.</p>'
      format: basic_html
      summary: ''
