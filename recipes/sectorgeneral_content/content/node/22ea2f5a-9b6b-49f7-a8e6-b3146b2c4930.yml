  body:
    -
      value: |-
        <p>Fix-up novel: &#039;Invader&#039;; &#039;Vertigo&#039;; Blood Brother&#039;; &#039;Meatball&#039;; &#039;Major Operation&#039; (see under Short Stories). &quot;Designed to accommodate virtually any creature brought in for observation or medical care, Sector General was staffed with at least a hundred different species of doctors and nurses. But there was trouble aboard. Some life form had entered the great hospital. The invader was invisible and undetectable -- even by the empathetic Cinrusskins -- and it was creating hallucinations that were causing serious accidents . . .&quot; (blurb). One of those rare fix-ups where the constituent parts hang both together and separately; in the capital reading sense, not punishment!</p>
        <p>First Publication:</p>
        <p>Ballantine Books No 345-02149-5-095, February 1971</p>
        <p>Publication History:</p>
        <p>BB, 2nd printing, ISBN 345-24229-7-125, October 1974</p>
        <p>BB, 3rd printing 0-345-29381-9, May 1981</p>
        <p>Macdonald/Futura, ISBN 0-7088-8185-8, £1-95, February 1987</p>
        <p>Collected in Beginning Operations, Orb (Tor Books), June 2001</p>
        <p>Foreign Publication:</p>
        <p>TERRA No 203, February 1973 as Die Artz der Galaxis</p>
        <p>Livros Do Brasil No 223, 1976 as A Grande Operacao</p>
        <p>Uitgerverj/Scala, ISBN 90-6221-641-2, 1977/8 as De Grote Operatie</p>
        <p>Wilhelm Heyne No 06/4974, 1993 as Grossoperation</p>
      format: basic_html
      summary: 'This is the third Sector General novel. Again this was previously published as short stories. Interestingly on the rear cover blurb it says "James White, himself a doctor..."! Well, he had the mind and compassion of a doctor, I suppose.'
