  body:
    -
      value: |-
        <p>&quot;...most of James White&#039;s writing has been concerned with the reconciliation of human to alien, and of human with human. The theme may be common to many writers. But White&#039;s stories of medicine as it may be practiced several hundred years in the future are uniquely imaginative, demonstrating again and again the fertility of his ideas and the humanity -- or should one say, the alienity -- of his approach?&quot; (blurb).</p>
        <p>Contents: &#039;Countercharm&#039;; &#039;To Kill or Cure&#039;; &#039;Red Alert&#039;; &#039;Tableau&#039;; &#039;The Conspirators&#039;; &#039;The Scavengers&#039;; &#039;Occupation: Warrior&#039; (see under Short Stories).</p>
      format: basic_html
      summary: 'This is a selection of seven short stories including ones set on Sector General.'
