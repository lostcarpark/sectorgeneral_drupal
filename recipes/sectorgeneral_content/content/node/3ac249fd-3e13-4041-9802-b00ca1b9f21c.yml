      value: |-
        <p>and the corporal, who was also a keen amateur gardener, and himself had become very pally.</p>
        <p>&#039;Assisted Passage&#039; is a titular allusion to the 1950s Anglo-Australian £10 per convict -- sorry colonist -- emigration. Doc Mathewson helps a marooned humanoid alien calling himself Allen to escape from Woomera rocket range back into space, using an Ion Drive of other-worldly invention. Wilson Tucker was then developing this E.T./Starman &#039;anticipation&#039; at novel-length, in The Time Masters (1953: revised edition, 1971). There&#039;s also a period-piece of Cold War paranoia: &quot;Why aren&#039;t you with Allen&#039;s friends, safe and sound, back in …&quot; (Major Turner to Doc Mathewson).</p>
        <p>*&quot;Self praise is no recommendation&quot; (I can almost hear James saying it).</p>
