  body:
    -
      value: '<p>&#039;Tableau&#039; proves beyond any possible doubt that James White was a muscular pacifist concerning militarism and those moral imbeciles who fight to the last drop of everybody else&#039;s blood. From Gary Louie&#039;s &#039;Sector General Timeline&#039; (see The White Papers): &quot;After a bad first contact, Earth and Orligia are at war for three years./Earth-human MacEwan and orligian Grawlya-Ki are stopped [in tableau vivant form]./After 236 years, Grawlya-Ki and MacEwan are brought out of stasis.&quot; Retroblurb: &quot;Makes All Quiet on the Western Front look like a vicarage tea party!&quot;</p>'
      format: basic_html
      summary: ''
