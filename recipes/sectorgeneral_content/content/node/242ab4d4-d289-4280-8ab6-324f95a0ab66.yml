  body:
    -
      value: '<p>John Carnell once wrote that James White &quot;. . . lays no claim to originality of plot, but he does strive to present his stories in a pattern different to most of his contemporaries, and in that lies his success&quot; (The Best of NEW WORLDS, Boardman, 1955). I must say that &#039;To Kill or Cure&#039; -- apart from its Northern Irish locale and punch-line ending -- is quite a routine first-contact story. All the same, Jim nimbly bridged the gap between having an idea and then working it into dramatic shape.</p>'
      format: basic_html
      summary: ''
