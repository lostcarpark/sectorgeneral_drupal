  body:
    -
      value: '<p>No-first-name Gregg is travelling as a mere company employee on the express liner Wallaby, en route from Mars to Earth. Then the A-(for Allen) Drive goes badly wrong, leaving the ship blind, deaf, and rudderless. Like Conrad&#039;s Lord Jim, Gregg has a Guilty Secret in His Past for which he must Redeem Himself with an Act of Heroism. Which he does, at hazard, becoming the nearest thing to a human barnacle in the process. Gripping stuff (pun intended). And &#039;Outrider&#039; is a well-fitted story: one word more would be too many; one less would be too few.</p>'
      format: basic_html
      summary: ''
