  body:
    -
      value: '<p>&quot;Take the problem of what to do with captured prisoners-of-war when they do not breathe the same atmosphere as you do, and the chances are you&#039;ll come up with the answer: put them on a planet where they can breathe; leave a satellite monitor to see that they don&#039;t try to escape and leave them to their own resources&quot; (from Tom Boardman, Jr.&#039;s introduction to the Four Square edition). Some prisoners plot escape; others just till their plots of land. The newly arrived Sector Marshall must avert a pointless civil war. Starship Troopers was nothing like this, I&#039;m happy to say.</p>'
      format: basic_html
      summary: 'Imagine a whole planet as a human prisoner-of-war camp in an intergalactic war. Open Prison was also published in the US as The Escape Orbit by Ace in 1965.'
