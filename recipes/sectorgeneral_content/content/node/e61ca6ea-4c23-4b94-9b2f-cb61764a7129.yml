  body:
    -
      value: |-
        <p>In 1959, Capt. W.E. Johns published a novel entitled Biggles Combined Operation. Jim at once owned up to being an inveterate fan of Squadron Leader Bigglesworth and his bi-plane-setting cronies. Sector General’s ‘combined operation’ entails Conway sewing together the sentient-jigsaw-puzzle CRLT* creature before plonking it down upon its new home planet.</p>
        <p>*Physically it resembles the DBLF Kelgian life-form, but it is many times larger and possesses a leathery tegument rather than the silvery fur of the Kelgians” (Louie, ibid.)</p>
