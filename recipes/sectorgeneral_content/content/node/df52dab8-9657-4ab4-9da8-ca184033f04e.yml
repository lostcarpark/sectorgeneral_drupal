  field_opening_excerpt:
    -
      value: '<p>Like a silver ghost the ferry rocket slid out of blackness and, briefly, transiting the dazzling globe of the five thousand miles distant Earth, checked its motion relative to the assembled passenger units with a short, savage burst of deceleration.</p>'
