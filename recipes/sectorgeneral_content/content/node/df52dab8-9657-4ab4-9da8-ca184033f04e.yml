  body:
    -
      value: '<p>Eighty-year-old Woodhill captains the kind of spaceship that makes any reference to atomic piles seem indelicate: &quot;. . . he looked out at his command which now hung like a bunch of silvery grapes against the stars.&quot; The &quot;grapes&quot; are inflatable, twenty-foot plastic passenger capsules. (Unlike their counterparts in Lifeboat/Dark Inferno, they actually work.) It all hangs together, scientifically (including the &#039;senior officer&#039; bit), but I&#039;d sure hate to build the Airfix model kit. Things go along well enough until the &#039;grapeliner&#039; encounters an alien spacecraft -- made of glass!</p>'
      format: basic_html
      summary: ''
