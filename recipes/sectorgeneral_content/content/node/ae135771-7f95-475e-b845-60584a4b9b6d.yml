  body:
    -
      value: |-
        <p>Normality “involves comaprison to a standard – but how do you judge the standard?” (blurb). How, indeed? The initally unnamed boy hates waking up on a birthday, because he’s never had one. I can almost hear you ask: “But why not, Graham?” for the very good reason . . . but that would be telling. ‘Un-Birthday’ is another James White story that was denied its rightful Hugo award. I suspect some jiggery, and a whole lot of pokery.</p>
        <p>(Shortlisted for International Science Fiction Award, HUGO, 1997. came second by 17 votes.)</p>
