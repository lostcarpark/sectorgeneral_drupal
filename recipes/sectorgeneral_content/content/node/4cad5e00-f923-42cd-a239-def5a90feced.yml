  body:
    -
      value: '<p>As the story opens, Dr. Conway is promoted to Senior Physician. But O&#039;Mara makes it sound more like a reversion in professional grade: &quot;What do you expect, praise? My job is to shrink heads, not swell &#039;em. And now I suppose I&#039;ll have to give you a minute to adjust to your new glory . . .&quot; Conway&#039;s swollen/shrunken head soon goes into staggered mode. The aforementioned wreck contains an alien &#039;out-patient&#039; who needs urgent medical attention. Which even Physician Conway finds to be easier said than done.</p>'
