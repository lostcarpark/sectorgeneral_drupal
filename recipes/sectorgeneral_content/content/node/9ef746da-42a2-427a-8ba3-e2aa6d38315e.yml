        <p><em>By Gary Louie</em></p>
        <p>James White's Sector General stories used a unique four letter classification system that helped describe the species quickly and effectivly, as one would require when the hospitol is a multi species enviroment. </p>
        <p>Gary Louie was working on a James White concordance. As part of that he completed a classification system, for the sector general series which covers all characters up to Final Diagnosis. </p>
        <p>This article appeared in the White Papers. Unfortunatly Gary Louie passed away, before the concordance was completed.</p>

        <h3>AACL</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Crepellian Pet No Individual Names Known</p>
        <p>A non-intelligent pet kept by AMSOs. It has six python-like ten-tacles which poke though seals in the cloudy plastic of its suit. The tentacles are each at least twenty feet long and tipped with a horny substance which must be steel-hard.</p>
        <h3>AACP</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown No Individual Names Known</p>
        <p>A race whose remote ancestors were a species of mobile vegetable. They are slow moving, but the carbon dioxide tanks which they wear seem to be the only protection they need. AACPs do not eat in the normal manner but plant themselves in specially prepared soil during their sleep period, and absorb nutriment in that way.</p>
        <h3>AMSL</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Creppelian, Crepellian<br><strong>Individuals:</strong> Nurse Towan, Diagnostician Vosan</p>
        <p>A species of water breathing octopoids.</p>
        <h3>AMSO</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>A larger life-form, in the habit of keeping non-intelligent AACL-type creatures as pets.</p>
        <h3>AUGL</h3>
        <p><strong>Planet:</strong> Chalderescol IT<br><strong>Species:</strong> Chaldor, Chalder<br><strong>Individuals:</strong> Patient AUGL-1 13, Patient AUGL-1 16, Patient AUGL-122, Patient AUGL-126, Patient AUGL-187, Patient AUGL-193, Patient AUGL-211, Patient AUGL-218, Patient AUGL-22 1, Patient AUGL-233, Muromeshomon</p>
        <p>The denizens of Chalderescol, an armored fish-like species are water-breathers who can not live in any other medium for more than a few seconds. A heavily plated and scaled being, slightly re-sembling a forty-foot long armour-plated crocodile, except that instead of legs there is an apparently haphazard arrangement of stubby fins, and a heavy knife-edged tail. A fringe of ribbon-like tentacles encircles its middle, projecting through some of the only openings visible in its organic armor. Chaldors have six rows of teeth in an over-large mouth. The Chalders are one of the frw in-telligent species whose personal names are used only between mates, members of the immediate family, or very special friends.</p>
        <h3>BLSU</h3>
        <p><strong>Planet:</strong> Groalter<br><strong>Species:</strong> Groalterri<br><strong>Individual:</strong> Hellishomar the Cutter</p>
        <p>The Groalterri overall body configuration is that of a squat octopoid with short, thick tentacular limbs. Its central torso and head seem disproportionately large. The eight limbs terminate alternately in four sets of claws (that will with maturity evolve into manipula-tory digits) and four flat, sharp-edged, osseous blades. The organ of speech and hearing is centered above the four heavily lidded eye that are equally spaced around the cranium. A macrospecies, there is an element of risk involved to any life-form of more or less nor-mal body mass which approaches it too closely.</p>
        <h3>BRLH</h3>
        <p><strong>Planet:</strong> Tarla<br><strong>Species:</strong> Tarlan<br><strong>Individuals:</strong> Surgeon-Captain/Trainee/Padre Lioren, Sedith and Wrethrin the Healers</p>
        <p>Tarlans are an erect quadrupedal life-form with its for short-legs supporting a tapering, cone-shaped body. Four long, multi-jointed, medial arms for heavy lifting and handling sprout from waist-level. Another four that are suited for more delicate work encircle the base of the neck. Equally spaced around the head are four eyes whose stalks are capable of independent motion. Tarlans have very large teeth. An adult Tarlan stands eight feet tall.</p>
        <h3>CLCH</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>Apparent typographical error for Classification CLHG.</p>
        <h3>CLHG</h3>
        <p><strong>Planet:</strong> Drambo<br><strong>Species:</strong> Roller<br><strong>Individuals:</strong> Camsaug, Surreshun</p>
        <p>The Rollers resemble animated donuts rolling on their outer edge, with manipulatory appendages in the form of a fringe ofshort ten-tacles sprouting from the inner circumference between the series of gill mouths and eyes. Its visual equipment must operate like a coeleostat since the contents of its field of vision are constantly rotating. The Rollers must roll to stay alive-there is an ingenious method of shifting its center of gravity while keeping itself upright by partially inflating the section of its body which is on top at any given moment. The continual rolling causes blood to circulate-it uses a form of gravity feed system instead of a muscular pump. The species reproduce hermaphroditically. Each parent after mating grows twin offspring, one on each side of its bodies like continu-ous blisters encircling the side walls of a tire. Injury, disease or the mental confusion immediately following birth could cause the parent to lose balance, roll on to its side, stop and die. The points where the children eventually detach themselves from their par-ents remain very sensitive areas to both generations and their posi-tions are governed by hereditary factors. The result is that any close blood relation trying to make mating contact causes itself and the other being considerable pain. The rollers really do hate their fa-thers and every other relative. The species is water-breathing with a warm-blooded oxygen-based metabolism. The life-support mechanism for the species is physically complicated, to allow the occupant to roll naturally within it. The concept of modesty is com-pletely alien to this race. This species does not know the meaning of sleep. There is no such thing as sleeping, pretending to be dead or unconsciousness. A Roller is either moving and alive or still and dead.</p>
        <h3>CLSR</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>Apparent typographical error for Classification CPSD.</p>
        <h3>CPSD</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> The Blind Ones</p>
        <p>No Individual Names Known</p>
        <p>These beings are roughly circular, just over a meter in diameter and, in cross section, a slim oval flattened slightly on the under-side. In shape they very much resemble their ship, except that the ship does not have a long, thin horn or sting projecting aft or a wide, narrow slit on the opposite side which is obviously a mouth. The upper lip of the mouth is wider and thicker than the lower, and can be curled over the lower lip, apparently sealing the mout shut. The beings are covered, on their upper and lower surfaces and around the rim, by some kind of organic stubble which varies in thickness from pin-size to the width of a small finger. The stubble on the underside is much coarser than that on the upper surface, and it is plain that parts of it are designed for ambulation. The Blind Ones evolved underground, and have no organs for sight. They formed an alliance with the Protectors of the Unborn, each species providing something that other lacked.</p>
        <h3>CRLT</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>Senior Physician Conway was unable to classi~ this life-form with complete certainty. The initial analysis was performed on a cadaver, an independent portion of a larger composite being. The compos-ite is a warm-blooded oxygen breather with the type of basic me-tabolism associated with the physiological grouping CRLT. Even a segment is massive, measuring approximately twenty meters in length and three meters in diameter, excluding projecting append-ages. Physically it resembles the DBLF Kelgian life-form, but it is many times larger and possesses a leathery tegument rather than the silver fur of the Kelgians. Like the DBLF&#x27;s it is multipedal, but the manipulatory appendages are positioned in a single row along the back. There are twenty-one of these dorsal limbs, all showing evidence of early evolutionary specialization. Six of them are long, heavy, and claw-tipped and are obviously evolved for defense since the being is a herbivore. The other fifteen are in five groups of three, spaced between the six heavier tentacles, which terminate in four digits, two of which are opposable. These thinner limbs are ma-nipulatory appendages originally evolved for gathering and trans-ferring food to the mouths-three on each flank opening into three stomachs. Two additional orifices on each side open into a very large and complex lung. The structure inside these breathing ori-fices suggests that expelled air could be interrupted and modulated to produce intelligence-bearing sounds. On the underside are three openings used for the elimination of wastes. The mechanism of reproduction is unclear and the specimen shows evidence of p05-sessing both male and female genitalia on the forward and rear extremities respectively The brain, if it is a brain, takes the form of a cable of nerve ganglia with localized swellings in three places, running longitudinally through the cadaver like a central core. There is another and much thinner nerve cable running parallel to the thicker core, but below it and about twenty-five centimeters from the underside. Positioned close to each extremity are two sets of three eyes. Two are mounted dorsally and two on each of the forward and rear flanks. They are recessed but capable of limited extension; together they give the being complete and continuous vision vertically and horizontally. The type and positioning of the visual equipment and appendages suggest that it evolved on a very unfriendly world. The tentative Classification is an incomplete CRLT</p>
        <h3>DBDG</h3>
        <p><strong>Planets:</strong> Earth, Gregory (Colony)<br><strong>Species:</strong> Earth-human, Gregorian<br><strong>Individuals:</strong> Theologian Augustine, Lieutenant Braithwaite, Sur-geon-Lieutenant Brenner, Corpsman Briggs, Lieutenant Briggs, Captain Chaplain Bryson, Lieutenant Carrington, Lieutenant Chen, Major Chiang, Clarke, Lieutenant Clifton, Junior Intern/Senior PhysicianlDiagnostician-in-Charge of Surgery Peter Conway, Sergeant Davis, Major/Colonel Jonathan Dermod, Fleet Commander Dermod, Lieutenant Dodds, Lieutenant Dowling, Major-Captain Fletcher, Fox, Trainee Hadley, Harmon, Lieuten-ant Haslam, Patient Hewlitt, Tailor George L Hewlitt, Mrs. George L Hewlitt, Captain Hokasuri, Major Holyrod, OR Nurse Hudson, Lieutenant-General Lister, MacEwan, Major Madden, Captain Mallon, Senior Physician/Diagnostician/Patient Mannen/Man non, Nurse/Pathologist Murchison, Major Nelson, Mister/Major/Chief Psychologist O&#x27;Mara, Captain Sigvard Nyberg, Doctor Pelling, General Prentiss, Reviora, Lieutenant-Colonel Simmons, Colonel Skempton, Surgeon-Lieutenant/Major Stillman, Lieutenant-Sur-geon Sutherland, Corpsman Timmins, Lieutenant Wainright, Waring, Corpsman/Colonel-Captain Williamson<br><strong>Probable Individuals:</strong> Lieutenant Carmody, Lieutenant Carson, Section Chief Caxton, Major Colinson, Major Craythorne, Major Edwards, Doctor Hamilton, Dietician-in-ChiefKW Hardin, Lieu-tenant Harrison, Lieutenant Hendricks, Kellerman, Colonel Okaussie, Captain Stillson, Captain Summerfield, TrooperTeirnan, Surgeon-Captain Telford</p>
        <p>This species shows their teeth in a silent snarl when displaying amusement or friendship and make an unpleasant barking sound that denotes amusement. The sound, called laughing, in most cases a psychophysical mechanism for the release of minor degrees of tension. An Earth-human laughs because of sudden relief from worry or fear, or to express scorn or disbelief or sarcasm, or in re-sponse to words or a situation that is ridiculous, illogical or funny, or out of politeness when the situation or words are not funny but the person responsible is of high rank. The Earth-human voice is reputed to be one of the most versatile instruments in the Galaxy. The Earth-human DBDGs are the only race in the Galactic Fed-eration with a nudity taboo, and one of the very few member spe-cies with an aversion to making love in public. The Earth-human DBDGs make up the majority of the Monitor Corps forces.</p>
        <h3>DBDG</h3>
        <p><strong>Planets:</strong> Etlan Empire, Central World (Capital), Imperial Etla (Capital), Etla, Etla the Sick (Colony)<br><strong>Species:</strong> Etlan, Imperial<br><strong>Individuals:</strong> Heraltnor, Imperial Representative Teltrenn</p>
        <p>The physiology of the citizens of the Empire is the same as the population of their colony Etla. The physiological resemblance is so close to Earth-human DBDGs that no other disguise other than native language and dress is needed. There are theories about a prehistoric colonization program by common, star-travelling an-cestors. Attempts at procreation between Earth-human DBDGs and Etlans have been unsuccessful.</p>
        <h3>DBDG</h3>
        <p><strong>Planet:</strong> Nidia<br><strong>Species:</strong> Nidian<br><strong>Individuals:</strong> Chief of Procurement Creon-Emesh, Senior Physi-cian and Tutor Cresk-Sar, Surgeon-Lieutenant Dracht-Yur, Lieu-tenant-Colonel Dragh-Nin, Senior Physician Lesk-Murog, Senior Food Technician Sarnyagh-Sa, Yoragh-Kar<br><strong>Probable Individual:</strong> Surgeon-Lieutenant Krack-Yar</p>
        <p>The Nidians have seven-fingered hands, stand only four feet tall. They have a thick red fur coat, and look like a very cuddly teddy-bear.</p>
        <h3>DBDG</h3>
        <p><strong>Planet:</strong> Orligia<br><strong>Species:</strong> Orlig, Orligian<br><strong>Individuals:</strong> Grawlya-Ki/Grulyaw~Ki, Surgeon-Lieutenant Krach-Yul, Major Sachan-Li, Colonel Shech-Rar, Surgeon-Lieutenant Turragh-Mar</p>
        <p>Like the neighboring Nidians, Orligians resemble an Earth-hu-man child&#x27;s first non-adult friend&#x27;s teddy bear.</p>
        <h3>DBLF</h3>
        <p><strong>Planet:</strong> Ia<br><strong>Species:</strong> Ian (pre-adolescent)</p>
        <p>No Individual Narnes Known</p>
        <p>The being appears ring-shaped, rather like a large balloon tire. Overall diameter of the ring is about nine feet, with the thickness between two and three feet. The tegument is smooth, shiny and grey in color where it is not covered with a thick, brownish incrus-tation. The brown stuff, which covers more than half of the total skin area, looks cancerous, but may be some type of natural cam-ouflage. There are five pairs of limbs, and no evidence ofspecial-ization. No visual organs or means of ingestion can be seen. The being isn&#x27;t a doughnut, but possesses a fairly normal anatomy of the DBLF type~a cylindrical, lightly-boned body with heavy musculature. The being is not ring-shaped, but gives that impres-sion because for some reason, known best to itself, it has been try-ing to swallow its tail. Senior Physician Conway, convinced all along that the patient is undergoing a natural metamorphosis, observes that the new patient, after the process is complete, is of classifica-tion GKNM.</p>
        <h3>DBLF</h3>
        <p><strong>Planet:</strong> Kelgia<br><strong>Species:</strong> Kelgian<br><strong>Individuals:</strong> Patient Henredth, Senior Physician Karthad, Charge Nurse Kursedd, Diagnostician Kursedth, Patient Morredeth, Charge Nurse Naydrad, Fleet Commander Roonardth, Charge Nurse Segroth, Diagnostician Suggrod, Student Nurse Tarsedth, Diagnostician Towan, Senior Physician Yarrence<br><strong>Probable Individual:</strong> Charge Nurse Kursenneth</p>
        <p>Kelgians are warm-blooded, oxygen-breathing, multipedal, and with a long, flexible cylindrical body covered overall by highly mobile, silvery fur. The Kelgian forelimbs have three digits. There are twenty sets of short, thin, and not heavily muscled walking limbs. The feet, which have no toe-nails or other terminations, are like small, hard sponges.The fur moves continually in slow ripples from the conical head right down to the tail. These are completely involuntary movements triggered by its emotional reactions to outside stimuli. The evolutionary reasons for this mechanism are not clearly understood, not even by the Kelgians themselves, but it is generally believed that the emotionally expressive fur comple-ments the Kelgian vocal equipment, which lacks emotional flex-ibility of tone.The movements of the fur make it absolutely clear to another Kelgian-what a Kelgian feels about the subject under discussion. As a result they always say exactly what they mean be-cause what they think is plainly obvious-at least to another Kelgian.They can not do otherwise. Kelgians have an intense aver-sion towards any surgical procedure which would damage or dis-figure its most treasured possession, its furs. To a Kelgian the re moval of a strip or patch of fur, which in their species represents ~ means of communication equal to the spoken word, is a personal tragedy which all too often results in permanent psychological damage. A Kelgian&#x27;s fur does not grow again and one whose pelt is damaged can rarely find a mate because it is unable to fully display its feelings. Kelgians are very close to Earth-humans in both basic metabolism and temperament. Except for the thin-walled, narrow casing which houses the brain, the DBLF species has no boney structure. Their bodies are composed of an outer cylinder of mus-culature which, in addition to be being its primary means of loco-motion, serves to protect the vital organs within it. To the mind of a being more generously reinforced with bones, this protection is far from adequate. Another severe disadvantage in the event of in-jury is its complex and extremely vulnerable circulation system; the blood-supply network which has to feed the tremendous bands of muscle encircling its body runs close under the skin, as does the nerve network that controls the mobile fur. The thick fur of the pelt gives some protection here, but not against chunks ofjagged-edged, flying metal. An injury which many other species would consider superficial could cause a DBLF to bleed to death in min-utes. Kelgians are herbivorous.</p>
        <h3>DBPK</h3>
        <p><strong>Planet:</strong> Dwerla<br><strong>Species:</strong> Dwerlan</p>
        <p>No Individual Names Known</p>
        <p>A warm-blooded oxygen-breathing herbivore that does not walk upright. Judging by the shape of the spacesuits, the beings are flat-tened cylinders about six feet long with four sets of manipulatory appendages behind a conical section which is probably the head, and another four locomotor appendages. Apart from the smaller size and number of appendages, the beings physically resemble the Kelgian race. The pointed, fox-like head and the thick, broad-striped coat make it look like a furry, short-legged zebra with an enormous tail. These beings seem not to possess natural weapons of offrnce or defense, or any signs of having had any in the past. Even their limbs are not built for speed, so they can not run from danger. The set used for walking are too short and are padded, while the fotward set are more slender, less well-muscled and end in four highly flexible digits which don&#x27;t possess so much as a fingernail among them. There are the fur markings, of course, but it is rare that a life-form rises to the top of its evolutionary tree by camou-flage alone, or by being nice and cuddly. The species has two sexes, male and female, and the reproductive system seems relatively nor-mal. Both sexes use a water soluble dye to enhance artificially the bands of color on their body fur~clearly the dyes are for cosmetic reasons. The immature do not use dyes, but use a brownish pig-ment on a bare patch above the tail.</p>
        <h3>DCNF</h3>
        <p><strong>Planet:</strong> Sommaradva<br><strong>Species:</strong> Sommaradvan<br><strong>Individual:</strong> Trainee Cha Th rat</p>
        <p>Four Ambulatory limbs; Four waist-level heavy manipulators; and a set of manipulators for food provisions and fine work encircling the neck. This being has two stomachs. Sommaradvan society is stratified into three levels~serviles, warriors, and rulers~which strictly govern how an individual acts within the society.</p>
        <h3>DCSL</h3>
        <p><strong>Planet:</strong> Cromsag<br><strong>Species:</strong> Cromsaggar</p>
        <p>No Individual Names Known</p>
        <p>This species has three sets of limbs: two ambulators, two medial heavy manipulators, and two more at neck level for eating and to perform more delicate work. It has a cranium covered by thick, blue fur that continues in a narrow strip along the spine to the vestigial tail.</p>
        <h3>DHCG</h3>
        <p><strong>Planet:</strong> Wemar<br><strong>Species:</strong> Wem<br><strong>Individuals:</strong> First Hunter Creethar, Hunter Druuth, Youth Evemth, First Cook Remrath, First Teacher Tawsar</p>
        <p>The Wem life-form is a warm-blooded, oxygen-breathing species with an adult body mass just under three times that of an Earth-human and, since Wermar&#x27;s surface gravity is one point three eight standard Gs, a healthy specimen is proportionately well-muscled. It resembles the rare Earth beast called a kangaroo. The differences are that the head is larger and fitted with a really ferocious set of teeth; each of the two short forelimbs terminate in six-fingered hands possessing two opposable thumbs, and the tail is more massive and tapered to a wide, flat triangular tip composed of immobile osseous material enclosed by a thick, muscular sheath. The flattening at the end of tail serves a threefold purpose: as its principal natural weapon, as an emergency method of fast locomotion while hunting or being hunted, and as a means of transporting infant Wem who are too small to walk. The Wem hunt by adopting an awkward, almost ri-diculous stance with their forelimbs tightly folded, their chins touch-ing the ground, and their long legs spread so as to allow the tail to curve sharply downwards and forwards between the limbs so that the flat tip is at their center of balance. When the tail is straight-ened suddenly to full extension, it acts as a powerful third leg ca-pable of hurling the Wem forward for a distance of five or six body lengths. If the hunter does not land on top of its prey, kicking the creature senseless with the feet before disabling it with a deep bite through the cervical vertebrae and underlying nerve trunks, it piv-ots rapidly on one leg so that the flattened edge of the tail strikes its victim like a blunt, organic axe. While the tail is highly flexible where downward and forward movement is concerned, it cannot be el-evated above the horizontal line of the spinal column.The back and upper flanks are, therefore, the Wem&#x27;s only body areas that are vul-nerable to attack by natural enemies, who must also possess the el-ement of surprise if they are not to become the victim.</p>
        <h3>DRVJ</h3>
        <p><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> Doctor Yeppha<br><strong>Planet:</strong> Unknown</p>
        <p>A small, tripedal, fragile being. From the furry dome of its head there sprout singly and in small clusters, at least twenry eyes.</p>
        <h3>DTRC</h3>
        <p><strong>Species:</strong> Rhum<br><strong>Planet:</strong> Unknown<br><strong>Individual:</strong> Crelyarrel</p>
        <p>Flat, roughly circular beings, dark gray and wrinkled on one sur-face, and with a paler, mottled appearance on the other, smooth, surface. The beings attach to their FGHJ hosts with thick tendrils growing from the edge of the disk. The tendrils penetrate into their FGHJ hosts&#x27; spinal columns and rear craniums. The DTRCs have their own special needs that in no way resemble those of their hosts, whose animal habits and undirected behavior are highly repugnant to them. It is vital to the DTRCs continued mental well-being that the masters escape periodically from their hosts to lead their own lives~usually during the hours of darkness when the tools are no longer in use and can be quartered where they can not harm them-selves.</p>
        <h3>DTSB</h3>
        <p><strong>Planet:</strong> Traltha<br><strong>Species:</strong> Tralthan</p>
        <p>No Individual Names Known</p>
        <p>Apparent typographical error for Classification OTSB.</p>
        <h3>EGCL</h3>
        <p><strong>Planet:</strong> Duwetz<br><strong>Species:</strong> Dewatti</p>
        <p>No Individual Names Known</p>
        <p>A warm-blooded, oyxgen-breathing life-form of approximately twice the body weight of an adult Earth-human. Visually it re-sembles an outsize snail with a high, conical shell which is pierced around the tip where its four extensible eyes are located. Equally spaced around the base of the shell are eight triangular slots from which project the manipulatory appendages. The carapace rests on a thick, circular pad of muscle which is the locomotor system. Around the circumference of the pad are a number of fleshy pro-jections, hollows and slits associated with its systems of ingestion, respiration, elimination, reproduction, and nonvisual sensors. The EGCLs are organic empaths. They are organic transmitters, reflec-tors and focusers and magnifiers of their own feelings and those of the beings around them. The faculty has evolved to the stage where they have no conscious control over the process.</p>
        <h3>ELNT</h3>
        <p><strong>Planet:</strong> Melf Four<br><strong>Species:</strong> Melfan<br><strong>Individuals:</strong> Maintenance Technician Dremon, Senior Physician Edanelt, Diagnostician Ergandhir, Patient Kennonalt, Patient KIetilt, Maintenance Technician Kiedath, Nurse Lontallet, Senior Physician Medalont, Senreth</p>
        <p>Melfans are large, low slung crab-like crustaceans. The six thin, bony, tubular, multi-jointed legs project from slits where the bony carapace and underside join. The legs and all of the body are ex-oskeletal. The head has large, protruding, vertically-lidded eyes, enormous mandibles, and pincers projecting forward from the place where ears should be. Two long, thin and fragile feelers grow from the sides of the mouth. The species is amphibious.</p>
        <h3>EPLA</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> Lonvellin</p>
        <p>Apparent typographical error for Classification EPLH.</p>
        <h3>EPLH</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> Lonvellin</p>
        <p>The being is large, about one thousand pounds mass, and resembles a giant, upright pear. Five thick, tentacular appendages grow from the narrow head section and a heavy apron of muscle at its base gives evidence of a snail-like, although not necessarily slow, method of locomotion. The being is warm-blooded and has fairly normal gravity requirements. Five large mouths are situated below the root of each tentacle, four being plentifully supplied with teeth and the fifth housing the vocal apparatus. The tentacles themselves show a high degree of specialization at their extremities: three of them are plainly manipulatory, one bears the patient&#x27;s visual equipment, and the remaining member terminates in a horn-tipped, boney mace. The head is featureless, being simply an osseous dome housing the brain. The cranium is pierced at regular intervals for visual, aural and olfactory sensors. Their life-span, lengthy to begin with, is ar-tificially extended. Because they have tremendous minds, they have plenty of time, but they constantly have to fight against boredom. Because part of the price of such longevity is an ever-growing fear of death, they need to have their own personal physicians~no doubt the most efficient practitioners of medicine known to them-constantly in attendance.</p>
        <h3>FGHJ</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>The being has six limbs, four legs and two arms, all very heavily muscled, and is hairless except for a narrow band of stiff bristles running from the top of the head along the spine to the tail, which seems to have been surgically shortened at an early age. The body configuration is a thick cylinder of uniform girth between the fore and rear legs, but the forward torso narrows towards the shoulders and is carried erect. The neck is very thick and the head small. There are two eyes, recessed and looking forward, a mouth with very large teeth, and other openings that are probably aural or olfactory sense organs. The legs terminate in large, reddish-brown hooves. Each hoof has four digits and does not appear particularly dexterous. This creature serves as a host to beings of Classification DTRC.</p>
        <h3>FGLI</h3>
        <p><strong>Planet:</strong> Traltha<br><strong>Species:</strong> Tralthan<br><strong>Individuals:</strong> Patient Cossunallen, Crajarron, Chief Dietitian Gurronsevas, Patient Horrantor, Senior Physician Hossantir, Surriltor, Senior Diagnostician-in-Charge of Pathology Thorn-nastor</p>
        <p>A massive entity with an osseous dome housing its brain, six el-ephantine feet connected to its triple massive shoulders, and four extensible eyes on an immobile head. Its six stubby legs normally give the Tralthan species such a stable base they frequently go to sleep standing up. Even healthy Tralthans have great difficulty get-ting up again if they fall onto their sides. Tralthans must not be rolled onto their backs under normal gravity conditions since this causes organic displacement which would increase their respira-tory difficulties. Standard gravity at Sector General is just over half Tralthan normal. Tralthans are vegetarians.</p>
        <h3>FOKT</h3>
        <p><strong>Planet:</strong> Goglesk<br><strong>Species:</strong> Gogleskan<br><strong>Individuals:</strong> Healer &#x27;(hone and child</p>
        <p>The Gogleskan FOKT resembles a large, dumpy cactuslike plant whose spikes and hair are richly colored in a pattern which seems less random the more you look at it. A faint smell comes from the entity, a combination of musk and peppermint. The mass of un-ruly hair and spikes covering its erect, ovoid body are less irregular in their size and placing than is at first apparent. The body hair has mobility, though not the high degree of flexibility and rapid mo-bility of the Kelgian fur, and the spikes, some of which are extremely flexible and grouped together to form a digital cluster, give evi-dence of specialization. The other spikes are longer and stiffer, and some of them seem to be partially atrophied, as if they were evolved for natural defense, but the reason for their presence has long since gone. There are also a number of long, pale tendrils lying amid the multicolored hair covering the cranial area, used for contact telepa-thy. Its voice seems to come from a number of small, vertical breath-ing orifices which encircles its waist. The being sits on a flat, mus-cular pad, and it has legs as well. These members are stubby and concertina-like, and when the four of them are in use they increase the height of the being by several inches. The being al50 has two additional eyes at the back of its head~obviously this species has had to be very watchful in prehistoric times.</p>
        <h3>FROB</h3>
        <p><strong>Planet:</strong> Hudlar<br><strong>Species:</strong> Hudlar, Hudlarian<br><strong>Individuals:</strong> Patient FROB-3, Patient FROB-lO, Patient FROB-18, Patient FROB-43, Patient FROB-1 132, Trainee FROB-61, Trainee FROB-73, Senior Physician Garoth, Infant Patient Metiglesh</p>
        <p>Hudlars are blocky, pear-shaped beings whose home planet pulls four Earth gravities and has a high-density atmosphere so rich in suspended animal and vegetable nutrients that it resembles thick soup. Although the FROB life-form is warm-blooded and techni-cally an oxygen-breather, it can go for long periods without air if its food supply, which it absorbs directly through its thick but highly porous tegument, is adequate. Hudlars are massive six legged be-ings. Each leg is an immensely strong tapering tentacle, which ter-minates in a cluster of flexible digits, curled inward so that the weight is born on heavy knuckles and the fingers remain clear of the floor. The two lidless, recessed eyes are protected by hard, trans-parent and featureless casings. Hudlars communicate using a speak-mg membrane, which grows like a cock&#x27;s comb from the top of the head. The speaking membrane also serves as a sound sensor. The skin resembles a seamless covering of flexible armor in appearance and texture. Food is ingested through organs of absorption that cover both flanks and the wastes are eliminated by a similar mecha-nism on the underside. Both systems are under voluntary control. Because of the physiological necessity for avoiding further sexual contact with its life-mate, a gravid Hudlar female changes gradu-ally into male mode and, concurrently, its life-mate slowly becomes female. A Hudlar year after partuition the changes to both are com-plete.The Hudlar FROBs are acknowledged to be, physically, stron-gest life-forms of the Galactic Federation and to have the least-pervious body tegument. Contact with chlorine is instantly lethal to them. Hudlar blood is yellow and circulates under great pres-sure and pulse rate. Hudlars consider their names to be their most private and personal possession, and do not give or use their names in the presence of anyone who is not a member of the family or a close friend.</p>
        <h3>FSOJ</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Protectors of the Unborn</p>
        <p>No Individual Names Known</p>
        <p>The Protector of the Unborn is a large, immensely strong life-form that resembles aTralthan, but is less massive with stubbier legs pro-jecting from a hemispherical carapace flared out slightly around the lower edges. The deployment of the legs and tentacles is simi-lar to the Hudlar FROB life-form, but the carapace is a thicker ELNT Melfan shell without markings, and the FSOJ is plainly not herbivorous. From openings high on the carapace sprout four ten-tacles. Two different types of tentacles have been observed on dif-ferent beings: long and particularly thin tentacles which terminate in flat, spear-like tips with serrated boney edges, and thick tentacles terminating in a cluster ofsharp, bony projections which make them resemble spiked clubs. The four stubby legs also have osseous pro-jections which enable them to be used as weapons as well. Midway between two of the tentacle openings there is a larger gap in the carapace from which protrudes a head, all mouth and teeth. The large upper and lower mandibles are capable of deforming all but the strongest metal alloys. A little space is reserved for two well-protected eyes at the bottom of deep, boney craters. A serrated tail also protrudes from the heavily slitted carapace. While the under-side is not armored, as is the carapace, this area is rarely open to attack, and it is covered by a thick tegument which apparently gives sufficient protection. In the center of this area is a thin, longitudi-nal fissure which opens into the birth canal. It will not open, how-ever, until a few minutes before giving birth. The FSOJ brain is not in its skull, but deep inside the torso with the rest of the other vital organs. It is positioned just under the womb and surrounding the beginning of the birth canal. As a result, the brain is compressed as the embryo grows. If it is a difficult birth, the parent&#x27;s brain is destroyed and junior comes out fighting, with a convenient food supply available until it can kill something for itself Senior Physi-cians Conway&#x27;s first impression was that the entity was little more than an organic killing machine. Considering the fact that it is warm-blooded and oxygen-breathing, and its appendages show no evidence of the ability to manipulate tools or materials, Patholo-gist Murchison tentatively classified it as FSOJ and probably non-intelligent. The Unborn young of the bisexual FSOJ is retained in the womb until it is well-grown and fully equipped to survive. The Unborn is an intelligent and telepathic being, but loses these fac-ulties at birth.</p>
        <h3>GKNM</h3>
        <p><strong>Planet:</strong> Ia<br><strong>Species:</strong> Ian (adult)<br><strong>Individual:</strong> Patient Makolli</p>
        <p>The metamorphosed form of the adolescent DBLF life-form. The species created a colony in this galaxy, coming from an adjoining one. The race is oxygen-breathing and oviparous, having a long, rod-like but flexible body, and possessing four insectile legs, ma-nipulators, the usual sense organs, and three tremendous sets of wings. The life-form looks something like a large dragonfly.</p>
        <h3>GLNO</h3>
        <p><strong>Planet:</strong> Cinruss<br><strong>Species:</strong> Cinrusskin<br><strong>Individual:</strong> Senior Physician Prilicla</p>
        <p>Cinrusskins are enormous, incredibly fragile flying insects, with a tubular exoskeletal body. Six sucker-tipped pencil-thin legs, four even more delicately fashioned, tiny, precise manipulators, and four sets ofwide, iridescent, and almost transparent wings project form the body. The head is a convoluted eggshell, so finely structured that the sensory and manipulatory organs that it supports seem ready to fall off at the first sudden movement. The eyes are large and triple-lidded. The Cinrusskin are the Federation&#x27;s only empathic race. Cinruss has a dense atmosphere and one-eighth gravity. Cinrusskins are sexless.</p>
        <h3>LSVO</h3>
        <p><strong>Planet:</strong> Nallaji<br><strong>Species:</strong> Nallajim<br><strong>Individuals:</strong> Kytili, Senior Physician Seldal</p>
        <p>The species has a birdlike, fragile, low-gravity physiology, with three legs, two not-quite-atrophied wings, and no hands at all. When LSVOs eat, they are sickened by anything which doesn&#x27;t look like bird seed.</p>
        <h3>MSVK</h3>
        <p><strong>Planet:</strong> Euril<br><strong>Species:</strong> Eurils</p>
        <p>No Individual Names Known</p>
        <p>Fragile, tn-pedal, stork-like beings from a low gravity world. The MSVK environment has dim lighting and a opaque fog for an at-mosphere. The race is driven by an intense curiosity and hampered by extreme caution. They are the galaxy&#x27;s prime observers, and are content to look and learn and record through their long-probes and sensors without making their presence known. MSVKs have a low tolerance to radiation.</p>
        <h3>OTSB</h3>
        <p><strong>Planet:</strong> Traltha<br><strong>Species:</strong> Tralthan</p>
        <p>No Individual Names Known</p>
        <p>Tralthan Surgeons are really two beings instead of one, a combina-tion of FGLI and OTSB.The OTSB is a nearly mindless symbiont which lives with its FGLI host. At first glance the OTSB looks like a furry ball sprouting a long ponytail, but a closer look shows that the ponytail is composed of scores of fine manipulators, most of which incorporate sensitive visual organs. A cluster of wire-thin, eye- and sucker-tipped tentacles sends infinitely detailed visual in-formation to its giant host and receives instructions from the host. The Tralthan combinations are the best surgeons the Galaxy has ever known. Not all Tralthans choose to link up with a symbiote, but FGLI medics wear them like a badge of office.</p>
        <h3>PVGJ</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> Doctor Fremvessith</p>
        <p>Apparent typographical error for Classification PVSJ.</p>
        <h3>PVSJ</h3>
        <p><strong>Planet:</strong> Illensa<br><strong>Species:</strong> Illensan<br><strong>Individuals:</strong> Senior Physician Gilvesh, Charge Nurse Hredlichi, Diagnostician Lachlichi, Charge Nurse Leethveeschi<br><strong>Probable Individual:</strong> Charge Nurse Lentilatsar</p>
        <p>Illensans are chlorine breathers with shapeless spiny bodies and dry, rustling membranes joining the upper and lower appendages. The body resembles a haphazard collection of oily, yellow-green, un-healthy vegetation. The two stubby legs are covered by what look like oily blisters. Their loose protective suits are transparent except for the faint yellow fog of chlorine contained within. The Illensans are generally held to be the most visually repulsive beings in the Federation, as well as the most vain regarding their own physical appearance. Illensans suffer digestive upsets if they exercise after meals. Contact with water is instantly lethal to chlorine-breathers. PVSJs are not physiologically suited to the use of stairs and have very sensitive hearing.</p>
        <h3>QCQL</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>Apparent typographical error for Classification QLCL. Senior Phy-sician Mannen did not know there was any such beastie, but Ma-jor O&#x27;Mara had a tape. There were two casualties of this classifica-tion at Sector General. The operations were suit jobs, since the gunk that the QCQLs breath would kill anything that walks, crawls or flies, excluding them.</p>
        <h3>QLCL</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>Recent, and very enthusiastic, members of the Federation, this species had never been to Sector General until the war with the Empire. Then a small ward was prepared to receive possible QLCL casualties. The ward was filled with the horribly corrosive fog the QLCLs used for an atmosphere, and the lighting was stepped up to the harsh, actinic blue which the they consider restful.</p>
        <h3>SNLU</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name: Vosan<br><strong>Individual:</strong> Diagnostician Semlic</p>
        <p>The SNLU life form requires a refrigerated life-support system for its ultra-low-temperature environment while on the Chlorine and Oxygen levels. A frigid-blooded methane-breather, it is most com-fortable in an environment only a few degrees above absolute zero. The SNLUs have a complex mineral and liquid crystalline struc-ture. The species evolved on the perpetually dark worlds which detached from their original solar systems and now drift through the interstellar spaces. Physically they are quite small, averaging one-third the body mass of a being like a Kelgian. In order to allow contact with other, warmer, species, the SN LUs are required to wear a large, complex, highly refrigerated life-support and sensor trans-lation system, which requires frequent power recharge. The scales covering the SNLU&#x27;s eight-limbed, starfish-shaped body shine coldly through the methane mist like multihued diamonds, mak-ing it resemble some wondrous, heraldic beast. The SNLUs live and work in the almost total silence of beings with a hypersensitiv-ity to audible vibrations. These fragile, crystalline, methane-based life-forms would decompose at temperatures in excess of eighteen degrees above absolute zero and be instantly cremated if the tem-perature rose above minus one-twenty on the temperature scale in use in the Federation.</p>
        <h3>SRJH</h3>
        <p><strong>Planet:</strong> Drambo<br><strong>Species:</strong> Healers or Physicians or Protectors</p>
        <p>No Individual Names Known</p>
        <p>The Drambon Physicians are glorified leucocytes to the Drambon Strata Creatures, treating the many independent organisms living in and around those immense living carpets. The stupid, slow moving Drambon Physicians stay close to the most active and dan-gerous stretches of the Drambon shoreline. They resemble jelly-fish, so transparent that only their internal organs are visible. A leech-like form of life, the SRJHs seem comfortable in either air or water. Their reactions in the presence of severe illness or injury are instinctive. Using their spines or stings, they practice their profes-sion by withdrawing the blood of their patients and pun fying it of any infection or toxic substances before returning it to the patients&#x27; bodies. (The process repairs simple physical damage as well.) How-ever, not all the withdrawn blood is returned. It has not been es-tablished whether it is physiologically impossible for the SRJH to return it all or whether the Physician retains a few ounces as pay-ment for services rendered. A Physicians can kill as well as cure. It can barely touch a beast, causing a predator to go into a muscular spasm so violent that parts of its skeleton pop through the skin. There is no evidence that they communicate verbally, visually, tac-tually, telepathically, by smell or by any other system known to Sector General. The quality of their emotional radiation suggests that they do not communicate at all in the accepted sense. The Physicians are simply aware ofother beings and objects around them and, by using their eyes and a mechanism similar to the empathic faculty, they are able to identi~ friend and foe.</p>
        <h3>SRTT</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>This physiological type is amoebic, possessing the ability to extrude any limbs, sensory organs or protective tegument necessary to the environment in which it finds itself. It is so fantastically adaptable that it is difficult to imagine how one of these beings could ever fall sick in the first place.</p>
        <h3>TLTU</h3>
        <p><strong>Planet:</strong> Threcald 5<br><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> TLTU Diagnostician</p>
        <p>A TLTU doctor breathes superheated steam and has pressure and gravity requirements three times greater than the environment of the oxygen levels. The local protection needed by a TLTU doctor is a great, clanking juggernaut which hisses continually as if it is about to spring a leak. The large protective suit resembles a spheri-cal pressure boiler bristling with remote handling devices and mounted on caterpillar treads, and has to be avoided at all costs. The large size is needed to allow for heaters to render the occupant comfortable, and surface insulation and refrigerators to keep the vicinity habitable by other life-forms. The small TLTU life-form inhabits a heavy-gravity, watery planet with edible minerals, which circles very close to its parent sun. The TLTU&#x27;s blood consists of superheated liquid metal. TLTU patients are transported in their protective spheres anchored to stretcher carriers. These spheres emit a high-pitched, shuddering whine as their generators labor to main-tain the internal temperature at a comfortable, for their occupants, five hundred degrees.</p>
        <h3>TOBS</h3>
        <p><strong>Planet:</strong> Fotawn<br><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> Trainee/Doctor Danalta</p>
        <p>This being can extrude any limbs, sense organs, or protective tegu-ment necessary to the environment or situation in which it finds it-self. It evolved on a planet with a highly eccentric orbit, and with climatic changes so severe that an incredible degree of physical adapt-ability was necessary for survival. It became dominant on its world, and developed intelligence and a civilization, not by competing in the matter of natural weapons but by refining and perfecting its adap-tive capability. When it is faced by natural enemies, the options are flight, protective mimicry, or the assumption of a shape frightening to the attacker. The speed and accuracy of the mimicry, particularly in the almost perfect reproduction ofbehavior patterns, suggests that the entity may be a receptive empath. The empathic faculty is under voluntary control, so that the level of emotional radiation reaching its receptors can be reduced, or even cut off at will, should it become too distressing. With such effective means of self-protection avail-able, the species is impervious to physical damage other than by com-plete annihilation or application of ultrahigh temperatures.The con-cept of curative surgery would be a strange one indeed to members of that race. They do not require mechanisms for self-protection, so they are likely to be advanced in the philosophical sciences but back-ward in developing technology. When not trying to look like some-thing else, TOBSs take the configuration of a large, dark-green, uneven ball.</p>
        <h3>TRLH</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown</p>
        <p>No Individual Names Known</p>
        <p>The TRLH casualty was an ally of the Empire during that war. Classification was aided by the fact that the patient&#x27;s spacesuit was transparent as well as flexible. The atmosphere the being breathes is as exotic as that of the QCQLs, but can be reproduced. The TRLH has a thin carapace which covers its back and curves down and inwards to protect the central area of its underside. Four thick, single-jointed legs project from the uncovered sections. It has a large but lightly boned head, four manipulatory appendages, two recessed but extensible eyes, and two mouths.</p>
        <h3>VTXM</h3>
        <p><strong>Planet:</strong> Telf<br><strong>Species:</strong> Telfi, Telphi<br><strong>Individual:</strong> Astrogator-part Cheixic</p>
        <p>A group-mind species whose small beetle-like bodies live by the direct conversion of various combinations and intensities of hard radiation. Mthough individually the beings are quite stupid, the gestalt entities are highly intelligent. The Telfi operate in groups as contact telepaths to pool their mental and physical abilities. The Telfi have a spoken language as well as the telepathic faculty used between individuals, especially members of a family gestalt. An-other variant of the species resembles a large, terrestrial lizard, just under five feet long from the bulbous head to vestigial tail, with an extra set of fore-limbs growing from the base of the neck. The only visible features are two tiny, lidless eyes and the mouth. The four stubby walking limbs can be bent double to lie flat against the body while the two, longer forward manipulators can stretch forward and cross so as to allow the chin to rest on the crossover point. The skin of a dead Telfi is pale gray with a mottled and veined effect that resembles unpolished marble. The color is a symptom of ad-vanced radiation starvation and a lethal failure of the absorption mechanism. A healthy Telfi reflects no light at all, looking like liz-ard-shaped black holes. A healthyTelfi&#x27;s temperature is below room temperature. Investigating their ultra-hot metabolism closely is to risk radiation poisoning. There is a fallacy among non-medics that the Telfi cannot be closely approached or touched without the use of remotely controlled manipulators. To live they must absorb the radiation normally provided by their natural environment but when, for clinical reasons, the radiation is withdrawn for several days and they are week from their equivalent of hunger, their ra-dioactive emissions drop to a harmless level.</p>
        <h3>VUXG</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Name Unknown<br><strong>Individual:</strong> Dr. Arretapec</p>
        <p>The VUXG resembles nothing so much as a withered prune float-mg in a spherical gob of syrup. The species has telepathic, teleportive, and~sort of~precognitive abilities. The precognitive ability does not appear to be of much use because it does not work with individuals but only with populations, and so far in the fu-ture and in such a haphazard manner that it is practically useless.</p>
        <h3>Unknown</h3>
        <p><strong>Planet:</strong> Drambo<br><strong>Species:</strong> Farmer Fish</p>
        <p>No Individual Names Known</p>
        <p>The large-headed Farmer Fish are responsible for cultivating and protecting benign growth and destroying all other growth in the Drambon Strata Creature. Farmer Fish have stubby arms sprout-ing from the base of their enlarged heads.</p>
        <h3>Unknown</h3>
        <p><strong>Planet:</strong> Drambo<br><strong>Species:</strong> Strata Creatures</p>
        <p>No Individual Names Known</p>
        <p>The largest creature on the planet Drambo~so large that at a scoutship&#x27;s suborbital velocity of six thousand plus miles per hour it takes just over nine minutes to travel from one side of the pa-tient to the other. The creature is so vast that it has many indepen-dent parts performing specialized functions, such as the eye plants, air renewal plants, Farmer Fish, Thought Controlled Tools, and vegetable teeth. The parts can communicate via a mineral-rich sap. The creature uses water instead of blood as its working fluid. It is not clear if the entire creature is an animal or a plant, there being components of both in its immense expanse. There is only one intelligent Strata Creature on Drambo, and it is being treated for radiation poisoning.</p>
        <h3>Unknown</h3>
        <p><strong>Planet:</strong> Drambo<br><strong>Species:</strong> Thought Controlled Tools</p>
        <p>No Individual Names Known</p>
        <p>Under the mental control of its user, a &quot;tool&quot; can assume any use-ful shape imagined. At Sector General, one appeared as a Hudlar type six scalpel, a medium-sized box spanner, a metallic sphere, a miniature bust of Beethoven, a set of Tralthan dentures, and a Hudlar food sprayer, among other things. The tools belong to the only sentient Strata Creature on Drambo, and were used to attack the medical and military forces attempting to treat the Strata Crea-ture for radiation poisoning.</p>
        <h3>Unknown</h3>
        <p><strong>Planet:</strong> Dutha<br><strong>Species:</strong> Duthan<br><strong>Individuals:</strong> Patient Bowab, His Excellency the Lord Scrennagle of Dutha</p>
        <p>Duthans have a centaur-like body. The torso from the waist up resembles that of an Earth-human, but the musculature of the arms, shoulders and chest are subtly different. The hands are five-digi ted, each comprised of three fingers and two opposable thumbs. The head is carried erect above a very thick neck, which seems dispro-portionately small.The face is dominated by two large, soft, brown eyes that somehow make the slits, pro tuberan ces, and fleshy petals which comprise the other features visually acceptable.</p>
        <h3>Unknowm</h3>
        <p><strong>Planet:</strong> Keran<br><strong>Species:</strong> Keranni</p>
        <p>No Individual Names Known</p>
        <p>No description given.</p>
        <h3>Unknown</h3>
        <p><strong>Planet:</strong> Unknown<br><strong>Species:</strong> Kreglinni</p>
        <p>No Individual Names Known</p>
        <p>No description given.</p>
        <h3>Various</h3>
        <p><strong>Planet:</strong> Meatball<br><strong>Species:</strong> CLCH/CLHG Drambon Rollers, Drambon Farmer Fish, Drambon Strata Creatures, Drambon Thought Controlled Tools, SRJH Drambon Healers or Physicians or Protectors</p>
        <p>The planet was originally named by the crew of Descartes, but the name was considered derogatory by one of the native intelligent species. The planet is now referred to as Drambo.</p>
