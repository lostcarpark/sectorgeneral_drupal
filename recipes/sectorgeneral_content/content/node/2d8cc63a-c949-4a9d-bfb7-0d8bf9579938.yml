  body:
    -
      value: |-
        <p>The muscular medic called O&#039;Mara* is more like Vince (Ben Casey) Edwards than Richard (Dr. Kildare) Chamberlain. Early job evaluation: &quot;Approved Suitable for Heavy Sustained Labour.&quot; He practically built Sector Twelve General Hospital with his own two pork-butcher hands. &#039;O&#039;Mara&#039;s Orphan&#039; -- stuff Medic -- is a massive FROB Hudlar wee&#039;un placed in the tender loathing care of you-know-who. (&quot;Junior was hungry again . . . &quot;!) Popeye never had as much trouble with Swee&#039;pea. O&#039;Mara finally joins the medical staff, however, and the rest is far from silent.</p>
        <p>* I for one, believe his full name to be James W(hite) O&#039;Mara.</p>
