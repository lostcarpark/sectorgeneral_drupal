  body:
    -
      value: '<p>White doesn&#039;t just undercut readership expectations in &#039;Red Alert&#039;; he leaves them for dead long before the last page. Everra di Crennorlin-Su is the Governor of three inhabited solar systems and temporarily Commander of a 3,127-strong task force headed Earthwards. Character sketch: &quot;His particular form of insanity wasn&#039;t rare. It was called ambition.&quot; &#039;Tis a grievous fault -- or is it? What begins like a revamped &#039;Pushover Planet&#039; (see above) ends up as something completely different. And the allusion to Monty Python won&#039;t help you, a &#039;tall, a &#039;tall.</p>'
      format: basic_html
