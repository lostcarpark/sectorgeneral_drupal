  body:
    -
      value: '<p>White&#039;s first mood piece/character study. Gregory Mitchell is a misanthropic news commentator who believes that people are &quot;disease spots, just so many wild variables in an otherwise sane and scientifically well-ordered universe.&quot; Mitch (likely enough names after the Stephen Mitchell character in Charles Chilton&#039;s Jounrney Into Space BBC radio series) rethinks his attitude during a lone vigil on the Moon. Meanwhile, humanity itself might or might not be on the brink of self-destruction from a &#039;fireworks display&#039; ignited by the Mark 17 Bacteriological Bomb. And what do those three aliens think of it all . . .?</p>'
      format: basic_html
      summary: ''
