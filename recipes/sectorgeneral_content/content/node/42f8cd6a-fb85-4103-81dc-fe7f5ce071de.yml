  body:
    -
      value: |-
        <p>Most film/TV tie-in novelizations are no better than they could be, given their source material and the Old Pulp Pros generally hired for such transitional hackwork. Once in a long while, however, we have something worthy like Gene Roddenberry&#039;s (posthumous!) TV series, Earth: Final Conflict, and its best print analogue, The First Protector. White tells the story of Ma&#039;el, a Taelon scientist marooned in ninth-century (A.D.) Ireland. Ma&#039;el and several boon companions, including Captain Seosadn Uí Nuallain,* set out on a world-spanning quest for knowledge that will strongly affect future human-Taelon relations. &quot;Since this will be the last James White novel, it is fitting that it is one of his best&quot; (Morgan Llywelyn, speaking truth).</p>
        <p>*Better known to history as secret-immortal Joe Nolan, of the Belfast Science Fiction Group.</p>
      format: basic_html
      summary: 'Published posthumously. This is obviously a TV tie-in, but it really stretches the words "tie-in", as there is little sign of Boone or the rest of the TV regulars, at all. It is mentioned in the TV series that a Taelon visited Celtic Ireland to judge humanity. This is that story. James was chosen to do this piece due to his research into Irish history, and he made it his own. It''s a great read.'
