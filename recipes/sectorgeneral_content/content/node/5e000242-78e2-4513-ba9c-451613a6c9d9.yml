  body:
    -
      value: '<p>&quot;We have been judge and executioner to many planets such as this. Very few have not been found wanting and allowed to survive. This one will be given exactly what it deserves . . .&quot; So sayeth Srilla, hanging-judge captain of an alien Execution Ship, about the latest planetary case on his docket. He must figure out Earth&#039;s first spacebeing, who bears only an evolutionary relationship to Yuri Gagarin. The last line almost, but not quite, matches that from A.E. van Vogt&#039;s &#039;Recruitng Station&#039; (Astounding, February 1942), aka Masters of Time and Earth&#039;s Last Fortress.</p>'
