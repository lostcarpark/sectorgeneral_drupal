  body:
    -
      value: |-
        <p>James White&#039;s own favouritie James White novel. He got the catchy title from listening to &#039;O, Little Town of Bethlehem&#039; at a carol concert* The parallel-universe Hibernian Empire has risen to supreme power, with the help of applied Old World technology (Hero&#039;s steam engine, etc.) and new World natural resources (Brendan the navigator pre-empted Columbus by some five hundred years). Now the starship Aisling Gheal and its crew extend Oirish manifest destiny to outer space. Healer Nolan, an unbeliever in the priest-kings of Gor -- sorry, Hibernia -- finds himself pitted against the ultra-conservative Monsignor O&#039;Riordan. I lapped it up. Mind you, I also think that Darby O&#039;Gill and the Little People is a piece of grim documentary realism. *&quot;WHEN IRISH SPIES ARE SMILING&quot; makes for a somewhat less dignified back-cover blurbette.</p>
        <p>First publication:</p>
        <p>Ballantine/Del Rey, ISBN 0-345-37110-0, September 1991</p>
        <p>Back to Books Main Next: The Genocidal Healer</p>
      format: basic_html
      summary: "A universe where Hibernia is the greatest empire on earth, and from which the starship Aishling Gheal will go forth to the stars. At 441 pages this is James's longest book, and upon reading it you can appreciate the superb research that must have gone into this fine piece."
