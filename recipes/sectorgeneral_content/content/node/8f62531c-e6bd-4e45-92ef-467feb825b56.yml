  body:
    -
      value: '<p>&quot;The remorseless aggressors had everything in the galaxy on their side -- except the little idiosyncrasies of the human mind!&quot; That Jingoistic blurb has been lifted from Murray Leinster&#039;s novel Talents, Incorporated (Avon, 1962), but it also fits &#039;Pushover Planet&#039; to a tall T. Crellegnan dur Shan, Fleet Commander of the thirty-ninth Planter Expedition (etc., etc., ad nauseam), pits his wits against a captured Human male called Murchison. And, of course, he fails miserably. Murchison might well be ancestrally related to the pneumatic pathologist of Sector General fame.</p>'
      format: basic_html
      summary: ''
