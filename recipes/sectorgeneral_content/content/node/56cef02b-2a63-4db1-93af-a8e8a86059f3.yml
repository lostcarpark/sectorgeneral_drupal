  body:
    -
      value: |-
        <p>At one time, James White did little more than loiter beside the cybernetic superhighway. But he learned fast*. ‘Type “Genie” and Run’ is a comic-inferno fable about those perverse inanimate objects that pass themselves off as ‘computers’. Just like Tron, in fact, only with real words. The first-person narrator remains hidden behind his cloak of anonymity, which mught or might not be significant.</p>
        <p>*James always did beat me at Space Invaders (et bloody cetera). These shock victories/defeats caused no upset in the computer-gaming world.**</p>
        <p>**His Favorite Game in later years was X-wing, and apparently he was very good.</p>
      format: basic_html
