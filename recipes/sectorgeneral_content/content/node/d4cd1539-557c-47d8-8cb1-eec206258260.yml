  body:
    -
      value: '<p>White badly wanted to make the 100th issue of New Worlds, but :&quot;. . . I did not have a single alien ailment in my head. In desperation I [built] a story round an Earth-human condition that might have an extraterrestrial equivalent, an ailment of which I had first hand experience, diabetes&quot; (from the &#039;Secret history of Sector General&#039;: see under Non-fiction). Cue insulin injection. &quot;But suppose the diabetic patient was a crab-like life-form, whose limbs and body were covered by a hard shell?&quot; (ditto). Aldiss (&#039;Old Hundredth&#039;) and Wyndham (&#039;The Emptiness of Space&#039;) were also at their best for John Carnell&#039;s editorial centruy.</p>'
      format: basic_html
      summary: ''
