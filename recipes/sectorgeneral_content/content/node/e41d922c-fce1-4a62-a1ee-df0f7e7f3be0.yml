  body:
    -
      value: |-
        <p>The original James White Information site listed two 1980 Mondadori editions: Urania No 840, dated 15 August 1980, and a reprint dated 10 May 1980. They seem to be the same publication, so they're recorded here as one, but one may be a reprint of the other.</p>
        <p>Translator: <a href="https://opac.sbn.it/bid/RAV0870555">OPAC SBN's record</a> names him Mauro Galli. Mario Galli, who translated the 1969 edition, is assumed to be meant; nothing more was found on either name.</p>
