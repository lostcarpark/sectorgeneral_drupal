  body:
    -
      value: '<p>Unusually for 1957 (and much later), Captain Miller of the spaceship Star Fire is a woman, as on every other Star Line vessel. &quot;(mere) Men could not take Space -- or, rather, they could not look at it and stay sane.&quot; Something to do with the &#039;space-birth&#039; trauma. The female mind is, however, made of sterner and more pragmatic stuff. Captain Kate Janeway would approve, but I&#039;m not so sure about James T. Kirk or even Jean-Luc Picard.</p>'
      format: basic_html
      summary: ''
