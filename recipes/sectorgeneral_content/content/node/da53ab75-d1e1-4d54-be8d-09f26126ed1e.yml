  field_opening_excerpt:
    -
      value: '<p>Seen through the direct vision port the receding planet Mars was a completely uninteresting object -- a pink circle roughly the size of a golf ball held at arm&#039;s length with blurred edges, the brighter stars in the background showing as faint smudges of grey on the surrounding blackness.</p>'
