  body:
    -
      value: '<p>I can remember a time when Belfast was strewn with unexploded German bombs from the Second World War, and so -- of course -- could James White. &#039;Crossfire&#039; features Cotrell and Nelson (plus late-comer Corporal Barnes), a painfully British bomb-disposal team in some unspecified war. They are forced to confront Something From Out There. The ending should come as no real surprise, but Sergeant White makes effective use of his stint in the Air Training Corps. War Picture Library meets Thrilling Wonder Stories -- why not?</p>'
      format: basic_html
