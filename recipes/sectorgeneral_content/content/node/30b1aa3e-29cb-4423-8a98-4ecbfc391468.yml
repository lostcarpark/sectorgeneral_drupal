  body:
    -
      value: '<p>In short-story terms, Major Operation the Novel starts with an earthquake and builds up to a climax. (Sam GoldwynTM.) “. . . there is very little to say except that the poisoned and polluted living planet that was the patient in those stories ‘Meatball’ and ‘Major Operation’ required treatment on such a vast scale that the operation was a military one as well as a medical one ” (from ‘The Secret History of Sector General’’). I didn’t mention the ‘living planet’ part before now. How very careful of me.</p>'
