  body:
    -
      value: '<p>&quot;Five miles below the surface, Ross was awakened from the deep sleep of suspended animation to find himself in an empty world. There was no noise, or people, and no motion save for the steady activity of the hospital robots&quot; (blurb). Ross, the sole survivor of World War Last, must meet up with some other human beings -- even if he&#039;s got to create them himself. And, with the hibernation technique and omnicompetent robots at his command, he eventually does just that. After a fashion. White&#039;s most beautifully fitted piece of work, with this fitting Dedication: &quot;TO PEGGY, who isn&#039;t the last girl on Earth, just the only one.&quot;</p>'
      format: basic_html
      summary: 'The story of the last man on Earth, but with an "up-beat" ending.'
