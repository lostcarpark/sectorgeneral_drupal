  body:
    -
      value: '<p>&quot;This story will undoubtedly revive the old controversies about a man going into his past and killing his grandfather -- in this case the murderer doesn&#039;t know his victim at all not just why he is going to kill him. &quot;Only that he must -- if he can.&quot; (Blurb of the Year, 1954). Maldon time-jumps twenty years into the past to murder his own grandfather, Henry Steenson, when he was a mere stripling. As for the motive, I won&#039;t spoil White&#039;s cunningly overcomplicated plot if I tell you that the Clue is in the Title.</p>'
