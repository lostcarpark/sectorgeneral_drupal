  body:
    -
      value: '<p>M.C.S. Torrance, while mapping the many three-dimensional balnks in Federation star-charts, pops out of hyperspace near a big, sick . . . Spacebird. With great difficulty, major Madden ‘hightails’ it for Sector General. “A strange – and perhaps deadly – rash that covered its body may well have caused the creature’s companions to abandon their helpless friend” (blurb). The dirty birds. Rick Sternbach’s cover illustration for Futures Past (Ballantine edition) sets the scene perfectly. Just like my favourite Mystery in Space action shot, by Mike Sekowski. Attack on Fort Satellite: Wernher von Braun space-wheel under raygun-fire from space-suited ‘Greenskins’ riding iron-horse thingies. How sad, too bad, never mind.</p>'
