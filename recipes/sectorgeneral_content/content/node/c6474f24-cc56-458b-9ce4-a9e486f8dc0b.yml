  body:
    -
      value: '<p>The title was derived from Shakespeare&#039;s &quot;O, judgment! thou art fled to brutish beasts,/And men have lost their reason&quot; (Julius Caesar). But whose judgment? Who are the brutish beasts? And has reason really been lost, or simply misplaced? In the near future, a gigantic alien vessel known only as The Ship appears twelve million miles beyond the orbit of Mars. Six Earthmen in two spacecraft are sent to investigate this Big Indifferent Object, which is filled with hull-to-hull aliens of variant species. But, given the fraught situation and language difficulties, how can they separate crew members from passengers -- or worse? &quot;What we have here is a failure of communication&quot; (Paul Newman, in Cool Hand Luke).</p>'
      format: basic_html
      summary: 'Six astronauts are sent out to investigate an apparently derelict space ship. Upon entry to the spaceship the nightmare begins as they uncover a labyrinthine world filled with horror.'
