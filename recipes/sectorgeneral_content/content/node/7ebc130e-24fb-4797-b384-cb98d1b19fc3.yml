  body:
    -
      value: '<p>The only James White story published in Science Fantasy, editor Carnell&#039;s answer to Campbell&#039;s Unknown and Gold&#039;s Beyond. There was, however, no &#039;scientific&#039; reason for banishing it from New Worlds. Tate is the &quot;Emperor of the Dominions of Myra; the Protectorates, Dependencies, and Mandated Territories of Fomalhaut, of Cregennsil, and of Dubh; Lord of the Magellanic Hosts . . .&quot; Well said, oh court psychologist. Remember chamberlain John Bird&#039;s similar spiel in Jabberwocky? Extrapolating somewhat from Lord (absolute power) Acton, White shows that a solitary immortal ruler would be able to make his every dream -- and nightmare -- come true.</p>'
      format: basic_html
      summary: ''
