  body:
    -
      value: '<p>Groff Conklin&#039;s blurb is worth quoting in near-full: &quot;We are given a picture of a business (department store), a profession (security officer, otherwise known as night watchman), and an Event (capital E indeed!), with a vividness which seems astonishing when you examine the tale for signs of excitement. No real dialogue, almost no action in the melodramatic sense, great long paragraphs, and very little verbal effort to arouse your emotions (this is left to the nature of the Event itself!) -- and yet the reader is continuously enthralled from start to ironic last word. At least, I was.&quot; Me too, Groff.</p>'
      format: basic_html
      summary: ''
