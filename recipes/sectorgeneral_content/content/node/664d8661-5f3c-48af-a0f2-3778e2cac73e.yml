  body:
    -
      value: '<p>The Sirius/Dogstar bit cold have been put down to a Freudian woof, had not Jim told us that his inspiration for &#039;Dogfight&#039; came from seeing an ancient pooch asleep in torrential rain. &quot;. . . I kept thinking about that dog, about the human nature of dogs and the often animal nature of men. The result . . . one of my few war stories&quot; (from Introduction to Monsters and Medics). Battle computer RK9 = &#039;R&#039; for Robot and K9 for -- aargh! &#039;Dogfight&#039; also prefigures the major plot-point of Open Prison/The Escape Orbit (see under Books).</p>'
      format: basic_html
