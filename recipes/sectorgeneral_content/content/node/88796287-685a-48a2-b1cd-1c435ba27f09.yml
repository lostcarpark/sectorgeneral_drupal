  body:
    -
      value: '<p>Sector General, like its generic title, is an unassuming short story which does not aspire to the lordly -- well, mock-baronial -- estate of fix-up novel. And all the better for it. I&#039;ve got nothing against fix-up novels, my all-time favourite sf book being A.E.van Vogt&#039;s The War against the Rull. (I don&#039;t care what anybody thinks about that -- so there. N.B. The term &#039;fix-up&#039; was coined by van Vogt. Contents: &#039;Accident&#039;; &#039;Survivor&#039;; &#039;Investigation&#039;; &#039;Combined Operation&#039; (see under Short Stories).</p>'
      format: basic_html
      summary: 'The fifth book in the series, including the O''Mara "origin" story.'
