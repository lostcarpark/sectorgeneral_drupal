  body:
    -
      value: '<p>As explained in White&#039;s Introduction to Monsters and Medics, &#039;In Loving Memory&#039; was inspired by one of his in-between-stories conversations with &#039;a writer friend&#039; (a young Bobby Shaw). They decided to start one short story apiece with a man sitting on a rock, and take it from there. White transposed his rock -- but I&#039;m giving away an important plot-bit. Problem: The planet Kallec will spiral down into its own sun within thirty years, but all forms of life there face destruction long before then. Solution: A &#039;standardization treatment&#039; for turning diverse creatures into true Citizens of the Galaxy. Enter Earthman Ralston and Naleen, his Kallecian sweetheart, who rejects the treatment …</p>'
