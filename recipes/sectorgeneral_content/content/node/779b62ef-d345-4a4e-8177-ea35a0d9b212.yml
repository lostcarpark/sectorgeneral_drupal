  body:
    -
      value: '<p>Sector General the Eighth, but White used the once-cosy hospital setting to consider terminal illness, euthanasia, pangalactic theology, and many other deep-thinky bits. Surgeon-Captain Lioren is a Tarlan BRLH medic whose professional negligence had almost wiped out the pathologically violent Cromsaggars. Lioren demands the death penalty for himself, but he doesn&#039;t get it (a good thing, too, this being only page fifty). His redemption begins with easing the inevitable death of Earth-human Diagnostician Mannen, who has been a Sector Generaller since they built the place around him. He also treats Hellishomar the Cutter, a Groalterri patient who shares his moral anxieties: &quot;I am guilty of a great and terrible sin&quot; (p.110). Their matching problems are none-too-easily resolved, and there&#039;s a dash of macro-surgery at the climax.</p>'
      format: basic_html
      summary: 'What would you do with a doctor who - through his zeal to cure a plague - wiped out a planetary population? Make him a trainee psychologist of course!'
