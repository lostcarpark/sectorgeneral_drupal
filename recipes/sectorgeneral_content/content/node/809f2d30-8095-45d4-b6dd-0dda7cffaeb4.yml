  body:
    -
      value: |-
        <p>But Lonvellin, the ELPH patient, has a much smaller insiderkick. &#039;Resident Physician&#039; was later subsumed into the novel Star Surgeon, which had the unfortunate effect of making it into an almost &#039;invisible&#039; story. Whites BIG ALIEN/little alien idea probably had germinated from multiple re-readings of Needle (1950) by Hal clement. Conway to O&#039;Mara: &quot;. . . An intelligent, amoebic life-form, an organized collection of sub-microscopic, virus-type cells, would make the most efficient doctor obtainable.&quot; Nanotechnology, in all but name.</p>
        <p>*In future, all first lines will be quoted from the book version of any story later made part of a fix-up novel.</p>
