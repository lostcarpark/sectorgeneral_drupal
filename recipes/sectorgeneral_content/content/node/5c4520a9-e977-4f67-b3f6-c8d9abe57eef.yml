  body:
    -
      value: '<p>For one mad moment, I entertained the notion that James White had foretold the cosmic punishment of President Richard M. Nixon. The line &quot;Nixon was suffering -- terribly&quot; raised my moralistic hopes still further. But this particular is Ben Nixon, the nerdish brother of genius-level scientist Dr Charles L. Ben has stolen the Doc&#039;s foolproof indestructability device, with consequences that can rightfully be called infernal. The biter is well and truly bitten; over and over and over again. A warning to the curious: DON&#039;T TRY THIS AT HOME!</p>'
