  body:
    -
      value: '<p>Nicholson interfaces with Redmond, the ground-floor supervisor, salesgirl Miss (Arthura?) Clarke, and Harnrigg -- a working-class centauroid Apprentice from Another World. Harnrigg has perpetrated some (quote) &quot;Horseplay at the music counter&quot; (unquote). In pre-decimal currency, the estimated cost of damage is seven pounds, three shillings and sixpence. Including sales tax. They might have knocked off the odd farthing to round it down. Harnrigg means well but he&#039;s the proverbial bull -- sorry centaur -- in a china shop. &#039;Coops&#039; department store is an autobiographical pun on the now-defunct Belfast Co-operative society emporium, where Jim was working at the time.</p>'
      format: basic_html
