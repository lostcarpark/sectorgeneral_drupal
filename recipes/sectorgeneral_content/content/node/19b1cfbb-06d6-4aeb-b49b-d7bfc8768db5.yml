  body:
    -
      value: '<p>Not to be confused with (The) Final Diagnosis, by Arthur (Airport) Hailey. White harks back to the Galactic Federation/Etlan Empire conflict that raged in those now almost legendary days of Star Surgeon. Earth-human Patient Hewlitt, who had been but a boy on Etla at the time, suffers from severe post-traumatic xenophobia. He must also be cured of his supposedly impossible knack for catching every virus known to man or alien. Sector General accepted the conventional medical wisdom that germs from one world cannot infect beings who are native to another world -- until the &#039;Hewlitt Syndrome&#039; came along. Rave review from an unexpected source: &quot;A masterfully crafted puzzle that is pure catnip for science fiction fans&quot; (Romantic Times). Sector General (Ballantine, 1983).</p>'
      format: basic_html
      summary: 'Sector General number ten.'
