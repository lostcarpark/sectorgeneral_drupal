  body:
    -
      value: '<p>Star Walk No. 17 is a postal area far out on the Galactic Rim. (To Chief Psychologist O&#039;Meara, c/o Sector Twelve, General Hospital, Milky Way Galaxy, Star Walk No. 17 C.) courier-ship pilot Carmicheal (sic) and his Girl Everyday, Evelyn, get themselves into … I&#039;m not sure what, exactly. John Carnell, the normally astute editor of New Worlds, should have marked this one RETURN TO SENDER. Sorry, Jim.</p>'
      format: basic_html
      summary: ''
