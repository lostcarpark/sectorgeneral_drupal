  field_opening_excerpt:
    -
      value: '<p>He&#039;d certainly picked a fine spot to land this trip, Carmicheal thought disgustedly as the creep bounced and jolted its way towards the grounded C-ship; frozen, iron-hard soil split by a maze of cracks and gullies and strewn with rocks of every shape and size.</p>'
