  body:
    -
      value: '<p>&quot; … his remarkable talent for extrapolating human survival under enormously hostile conditions is exploited to the full in a tense and moving novel group of humans trapped in the hull of a sunken ship -- for generation! Skilfully woven into the desperate problems which confront [them] is the story of a far different group of beings, creatures who face extermination with courage and determination equal to that of the humans&quot; (blurb). The Watch Below more than fulfilled the potential James White had shown a s novelist in Second Ending and Open Prison. He produces meaningful drama without subjecting both sets of voyagers to the Dreaded Lurgi, flat atomic batteries and Ghod knows what all else.</p>'
      format: basic_html
      summary: "The setting for this story is a W.W.II tanker which is sunk, but which finds zero buoyancy below the surface due to a trapped air pocket, where a few have survived. At the same time an Alien race heads for Earth, where they become unlikely saviours. This book is considered by many to be James's finest work."
