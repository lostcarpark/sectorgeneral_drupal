  body:
    -
      value: '<p>Major Jonathan Dermod of the Seventeenth Earth Expeditionary Force (and later Monitor Corps Fleet Commander on Sector General) leads the above-mentioned military campaign, against rogue Kelgians. The Stellar Guard is a proto-Monitor Corps which ensure and/or enforces the maximum freedom for every individual entity of every galactic race. &quot;A being was free to engage in any activity whatsoever providing such activities did not infringe on the freedom of other beings. And if two groups of entities felt so strongly that their differences could be settled only by war, why then, the Guard arranged a war for them!&quot; Just like the British Army in Northern Ireland -- or am I being unduly cynical, here?</p>'
