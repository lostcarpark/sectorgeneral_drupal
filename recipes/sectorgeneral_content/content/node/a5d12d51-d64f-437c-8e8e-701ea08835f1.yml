  body:
    -
      value: |-
        <p>Mission statement: “. . . The primary purpose of the Federation is to seek out the intelligent races of the galaxy and bring them to this place of safety before they perish in some natural catastrophe or in some unnatural manner devised by themselves. [They] will grow in knowledge and in numbers and, in the fullness of time, they will intermingle and share in the fruits of their respective cultures.”</p>
        <p>Ergo: This non-Hospital Station, etc Galactic Federation intends the Dyson sphere living space to be a paradisical Shaangri-La – writ large. Jim admired Lost Horizon (1933), the classic novel by James Hilton which intriduced ‘Shangri-La’ to the mundane world. More specifically, he deals with the problem of how those Master-and-Slave Teldians can be made to fit into the New Worlds Order.</p>
