  body:
    -
      value: '<p>“I shall be guided by the vast experience of the cultural-contact specialists of the Monitor Corps, ”interrupts Conway, risking O’Mara’s non-righteous wrath. The idea for a ‘Blood Brother’ came from a boozy convention-party exchange between White and Ken Cheslin (erstwhile English SF fan): James, you know how doctors used to be called leeches. Why don’t you write a story where the doctor really is a leech? (from ‘The Secret History of Sector General’). The resultant alien ‘vampire’ extracts most of a patient’s blood, removes any toxins/whatever, then puts the blood back.</p>'
      format: basic_html
      summary: ''
