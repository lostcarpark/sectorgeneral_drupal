  body:
    -
      value: '<p>Rhabwar picks up an EGCL ‘transmitting’ empath from Duwetz, the sole survivor of a cataclysmic spacewreck. The ultra sensitive Dr Prilicla is painfully overwhelmed by this patient’s full-spectrum emotional radation. (“Of course!” Conway said, and paused because . . .) In case you’re wondering, EGCLs are warm-blooded oxygen breathers with approximately twice the body-weight of an adult DBDG Earth-human (see Gary Louie’s Sector General Classificiation System in The White Papers for more details.</p>'
