  body:
    -
      value: '<p>Star Surgeon was only nine-tenths a Sector General novel: Star Healer goes the whole distance. It&#039;s the story of how Conway &amp; Co. of the ambulance ship Rhabwar interact with the FOKT Gogleskans on their grim home world. &quot;Gosglesk has been a borderline case so far as the Cultural contact people were concerned . . . But the natives, in spite of their backwardness in the physical sciences and the obscure racial psychosis which forced them to remain so, were psychologically stable as individuals and the planet had not known war for many thousands of years&quot; (p. 37). Apropos of nothing at all, the Sector General series has always been especially popular in Glasgow. Synopsis by graham Andrews</p>'
