  body:
    -
      value: '<p>White based &#039;The Conspirators&#039; upon A. Bertram Chandler&#039;s &#039;Giant Killer&#039; (Astounding, October 1945), about mutated rats attempting to take over a generation starship. He was no mere copycat, however, despite the presence of Felix (the ship&#039;s feline Mascot). For some unexplained/inexplicable reason, all Shipboard animals have not only become super-intelligent but conveniently telepathic. Felix &quot;felt awed as he thought of Whitey in Bio-lab Three . . . surrounded by Big Ones, and the Small Ones who weren&#039;t on relay duties, and all of them working on Escape.&quot; (Whitey is a laboratory mouse endowed with leadership skills.) It reads a bit like Animal (Hydroponics) Farm, but the conclusion is light-years removed from both Orwellian cynicism and Campbell&#039;s increasingly hawkish Astounding</p>'
      format: basic_html
      summary: ''
