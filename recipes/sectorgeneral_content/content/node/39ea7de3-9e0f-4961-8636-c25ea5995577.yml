  body:
    -
      value: |-
        <p>Editorial blether: &quot;Dr. Conway and the Sector General hospital staff are taking a well-earned vacation at the moment so author James White has himself returned to Earth to recount a story of early spaceflight. There is more than one road to a given goal and it depends upon which one you take to get there first.&quot; &#039;Early spaceflight&#039; is painfully correct. I&#039;m afraid that &#039;The High Road has dated in all the wrong ways.* Jim took the auctorial Low Road, this one (and only) time.</p>
        <p>*Unlike, say, Henry Kuttner&#039;s Fury (1947). Or, say again, The Secret Visitors (see under Books).</p>
