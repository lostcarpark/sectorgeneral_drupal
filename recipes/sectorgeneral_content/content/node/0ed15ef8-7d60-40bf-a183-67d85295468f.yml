  body:
    -
      value: '<p>There is no truth to the rumour, which I’ve just started, that Jim named ‘Meatball’ after a song made briefly famous by Burl Ives. “We are carrying two Drambon natives. Drambo is the native name for the planet . . .” Conway tells Sector General Reception. “One of the natives is a CLHG, water-breathing, with a warm-blooded oxygen-based metabolism. The other is tentatively classified a SRJH and seems comfortable in either air r water.” The Drambon SRJH physician/leucocyte treats a blood-poisoned Kelgian in its own inimitable, but effective fashion.</p>'
