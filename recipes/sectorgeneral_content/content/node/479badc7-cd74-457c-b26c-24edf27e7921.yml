  body:
    -
      value: '<p>Captain Gregory seeks vital information from James Andrew Caulfield, erstwhile Engineer on the passenger-carrying freighter Sunflower and proven interplanetary litterbug. &quot;There had been a time when people thought it funny that a ship could be wrecked by . . . a frigid, iron-hard potato peeling. But among spacemen . . . it was the sort of joke at which you died laughing.&quot; Caulfield&#039;s eleven-year-old crime has already cost one ship and eighteen lives and the death toll might keep rising indefinitely. &#039;Deadly Litter&#039; should have won a Hugo and/or an Edgar award from the mystery writers of America.</p>'
