  body:
    -
      value: '<p>Definitely not to be confused with The Young Doctors (1963 Corgi retitling of Arthur Hailey&#039;s The Final Diagnosis). Although Dr. (Peter) Conway started &#039;life&#039; as an unaging character à la Dr. (James) Kildare, who might have been spontaneously generated for each book, he finally began to act his chronological age - well, most of the time. The same thing could be said about my favourite Sector General staff member, Chief Psychologist O&#039;Mara, who helped build the place around Diagnostician Mannen. Now the old warhorse faces mandatory turning out to pasture, if not the interstellar glue factory, and he&#039;s not particularly well-pleased at the prospect. Does the ultimate &#039;mind-changer&#039; go gently into that good senior-citizen night? No siree, Dr. Bob! &quot;Seconds out...&quot;</p>'
      format: basic_html
      summary: "This is the final story of O'Mara, the chief psychologist of Sector General. Personally this is my favourite book by James White. So much is answered in such surprising ways."
