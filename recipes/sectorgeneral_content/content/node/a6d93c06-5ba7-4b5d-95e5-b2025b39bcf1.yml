  body:
    -
      value: "<p><span><strong>CALLING DR. CONWAY. . .</strong></span><br><br><span>There was a lot of talk about the vital importance of his new assignment, but it still seemed like a demotion to Senior Physician Conway. After twelve years of outstanding service--and the most incredible experiences imaginable--Conway couldn't quite appreciate the \"honor\" of becoming an ambulance attendant at this stage of his life.</span><br><br><span>True, the insectile empath, Dr. Prilicla, would be with him--and so would the eminently desirable Nurse Murchison--but it was definately a comedown for a Senior Physican of his status to be conscripted as part of a first-aid team for disabled spacefarers.</span><br><br><span>Then the first call came--and Conway faced the problem of treating a spaceship crew's mysterious ailment. . . without wiping out every patient and doctor in Sector General!</span><br><br><span>A GRIPPING NOVEL OF A FUTURISTIC HOSPITAL'S BATTLE TO CONTAIN A POTENTIALLY DEADLY EPIDEMIC. . .</span></p>"
      format: basic_html
      summary: 'Sector General book four. This book also includes an introduction by James White called "The Secret History of Sector General".'
