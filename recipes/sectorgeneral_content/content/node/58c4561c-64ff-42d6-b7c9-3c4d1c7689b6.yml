  body:
    -
      value: |-
        <p>&#039;False Alarm&#039; is a puzzle-for-spacemen* story that holds more emotional significance than the usual clockworky, surprise-ending thing of its kind. Professor Davies, a philologist seconded to the A-Drive spaceship Hannibal, must extract vital data from the ET base left abandoned in Titan&#039;s methane snowbanks. But there &quot;was no Rosetta Stone to help him here (and) he had come nine million miles to rummage in an alien wastepaper basket.&quot;</p>
        <p>*Taken from John Brunner&#039;s &#039;Puzzle For Spacemen&#039; (New Worlds, October 1955)</p>
