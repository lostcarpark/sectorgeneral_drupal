      value: '<p>James White&#039;s first collection of non-Sector General stories. &quot;One day, inevitable, man will not only face the technical difficulties and the enormous physical dangers of extended space travel, but he will have to deal with the infinitely more complex and mental problems that an unnatural form of living will create&quot; (blurb). Move orbits, Arthur C. Clarke. Contents: &#039;Grapeliner&#039;; &#039;The Ideal Captain&#039;; &#039;The Lights Outside the Windows&#039;; &#039;Deadly Litter&#039; (see under Short Stories).</p>'
      format: basic_html
      summary: 'This is a selection of four short stories, the title story being perhaps the most gripping.'
