  body:
    -
      value: |-
        <p>&#039;Visitor at Large&#039; marks the Sector General debut of Dr Prilicla, the insectile Cinrusskin empath whom every perceptive reader loves to love. Conway and Prilicla find themselves treating a sick amoeboid SRTT alien that can never, ever, fall physically sick.</p>
        <p>But its psychological traumas would flummox Dr Anthony Clare himself, even if this patient at (very!) large didn&#039;t flatten his couch.</p>
        <p>I&#039;ll conclude by telling you that White&#039;s solution to the problem still holds water. No, please. Don&#039;t bother to thank me.</p>
      format: basic_html
      summary: ''
