  body:
    -
      value: |-
        <p>&quot;Yo, ho, ho and a bottle of Jet Morgan rum!&quot;* James White once aspired to out-Clarke Clarke as Spellsinger of the Spaceways -- with more success than he&#039;s generally given credit for (Deadly Litter is just a starter pack). The stricken Starcloud is the Earth&#039;s last hope against the Raghman invaders who have only one effective weapon: &quot;. . . the ghostly, flickering force-eddy. But that one was enough.&quot; Dr Grayson, the ship&#039;s self-deprecating medical officer, makes the most important &#039;house call&#039; of his career.</p>
        <p>*Another reference to Journey Into Space, the &quot;BBC radio serial that enthralled millions&quot; (book-jacket blurb).</p>
