  body:
    -
      value: '<p>Fix-up novel: &#039;Federation World&#039;; &#039;The Scourge&#039;; &#039;Something of Value&#039;; (see under Short Stories) Combined with the unpublished novelette &#039;The Silence&#039; and the short novel &#039;The Answer&#039; revised and with linking material added. All intelligent species discovered by the Federation of Galactic Sentients are encouraged to help populate the eponymous modified Dyson Sphere, situated at the galactic core. Federation World is the White line on Niven&#039;s Ringworld and Orbitsville - by his old Belfast mucker, Bob Shaw. Few better stories appeared in Analog during the 1980s, which might or might not be taken as a compliment. As Damon Knight wrote about Murray Leinster&#039;s The Monster from Earth&#039;s End (a neglected non-classic, if ever there was one): &quot;...the reader can&#039;t help knowing all along that everything will be explained calmly, rationally, and in a little too much detail.&quot;</p>'
      format: basic_html
      summary: 'The Federation World is a modified Dyson sphere in the galactic core where new species are invited to move, if they are deserving.'
