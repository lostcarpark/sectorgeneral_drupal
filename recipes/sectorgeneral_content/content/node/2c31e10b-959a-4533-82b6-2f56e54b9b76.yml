  field_opening_excerpt:
    -
      value: '<p>The convent of the sisters for the Missions to Africa was housed in a one-time castle on a low promontory which threw aside the long North Atlantic rollers like the bows of some great, basalt ship and gave to those who dwelt there, in whatever direction they chose to look, a view of scenery of such wild and extravagant beauty that it was almost in questionable taste.</p>'
      format: basic_html
