  body:
    -
      value: '<p>Sister Augustine, who heads a Rest Home on the North Irish (or Whiteland) coast, invokes the archaic law of Sanctuary to protect an inkured alien castaway from the paranoid temporal powers. If there’s a wrong note in this archetypal James White story – pace, structure, characterization, what-have-you – I must have missed it. Except, perhaps, the extraordinarily powerful TV presenter named ‘Ben Matlock’!</p>'
      format: basic_html
