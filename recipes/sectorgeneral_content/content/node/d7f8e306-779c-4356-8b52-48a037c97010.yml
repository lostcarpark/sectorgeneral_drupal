  body:
    -
      value: '<p>&quot;Accidents are going to happen in space when interplanetary travel becomes a fact. The most important on ship, space station or extrterrestrial base will be the doctors -- and they will have to discover new methods of treatment under very unearthly conditions.&quot; The title + foregoing blurb may be self-axplanatory -- runaway spaceship Queen of Darkness collides with Venusian space station, take it from there -- but don&#039;t let that put you off. Dr. (Gerald) Mathewson, of &#039;Assisted Passage&#039;/Allen Drive fame, makes a fleeting guest appearance.</p>'
      format: basic_html
