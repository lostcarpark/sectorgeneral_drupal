  body:
    -
      value: '<p>White&#039;s working title for The Dream Millennium was The Star Shepherd, which sounds like something from a flip-side of an old Ace Double volume. But &#039;shepherd&#039; would be a valid job description for Dr. John Devlin, who flits in-and-out of suspended animation to look after incessantly deep-frozen colonists fleeing the polluted Earth. &quot;And in that coldsleep, what dreams may come . . .&quot; as the Bardmaster of Avon surely meant to put it. Devlin runs the Jungian gauntlet from a Silurian trilobite&#039;s impersonal extinction to the killing of a British soldier on some Belfast back-street: &quot;Very soon he was dead. But for him not nearly soon enough . . .&quot; (p.156). The starship computer helps Devlin get through his 1,000-year trip -- trips, rather.</p>'
      format: basic_html
      summary: 'In the search for a new planet to colonize, the star of the novel suffers nightmares while in stasis, with a deadline of 1000 years.'
