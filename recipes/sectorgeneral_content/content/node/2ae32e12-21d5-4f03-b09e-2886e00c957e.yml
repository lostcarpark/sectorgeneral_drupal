  body:
    -
      value: |-
        <p>James White (1928–1999) was a science fiction writer from Belfast. He is best known for the Sector General stories, set in a huge hospital in space where doctors of many species treat patients stranger still. The series, begun in 1957 and running to twelve novels, is often credited with defining medical science fiction.</p>
        <p>White disliked violence, and his stories find their drama in emergencies, puzzles and the effort to understand the alien. This site lists everything he published, in English and in translation, with cover art, synopses and articles about him.</p>
        <p>Perhaps you are a fan already, who wants to know more, or perhaps you have never heard of James White. Either way, start below, or with Graham Andrews&#039;s <a href="/bio-bibliography">bio-bibliography</a>.</p>
