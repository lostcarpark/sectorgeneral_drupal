  body:
    -
      value: |-
        <p>‘Mr Smith’ (the sad-sack suspect) is being interrogated by bad-cop Sergeant Greer and good-cop Inspector Michaelson. “. . . Sergeant Greer was completely lacking in charm when he was angry”/Michaelson kept his tone grim but friendly . . .” So far, so Dime Detective magazine. But we soon find ourselves reading the best time-crossed lovers short story yet written.* If ‘Commuter’ had been published in Galaxy or F &amp; SF instead of the Anglocentric NWiSF, I feel sure that Jim would have notched up another Hugo award nomination. (Voters for the 1972 Retro-Hugos please take note.)</p>
        <p>I don’t care what anybody else thinks. Especially you – at the back.</p>
