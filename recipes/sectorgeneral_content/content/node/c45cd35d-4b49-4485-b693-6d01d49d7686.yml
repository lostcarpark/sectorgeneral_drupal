  body:
    -
      value: '<p>Another of White’s inimitable puzzle-for-spacemen stories. “In the great tradition of Deadly Litter!” – as Donald A. Wollheim, Mr Blurby himself, might have put it. “All the [spacewreck] victims had lost their limbs. The medics think they have the answer, but they are wrong . . .” (actual blurb, from the Ballantine edition). Well, they are and they aren’t. Is that Irish enough for you?</p>'
