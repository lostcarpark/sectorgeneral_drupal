  body:
    -
      value: '<p>Enter some tomorrow-people children from all over the 1960s cold War world. Four boys: Richard, Liam (from a &quot;fishing village on the North Irish coast&quot; -- probably Portstewart), Greg/Gregor Ivanovitch Krejinski, and buster. Two girls: Mub and Loo. The Splendid Six form a gestaltic unit much like the one described in Theodore Sturgeon&#039;s More Than Human (1953). Using their combined powers to look for Santa Claus (who lives &quot;somewhere at the North Pole in a secret cavern under the ice&quot;) they end up by averting World War Three -- permanently. And there&#039;s more . . .</p>'
