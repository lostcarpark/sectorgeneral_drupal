  body:
    -
      value: '<p>After the main course of Genocidal Healer came the pineapple chunks of Galactic Gourmet. Gurransevas, Tralthan FGLI master chef, takes on &quot;the greatest challenge of his professional life: making hospital food palatable&quot; (blurb). He starts by throwing his mighty Tralthan weight about, but hubris is finally clobbered by nemesis -- in the best possible taste, of course. White&#039;s ability to avoid the black-and-white characterization that marked, or marred, most &#039;traditional&#039; sf pulp writing is well showcased here. As Harry Harrison once said (possibly at the bar of Dublin&#039;s old-time Parliament Inn): &quot;You could always tell who the hero was by his white space helmet.&quot; A white chef&#039;s hat doesn&#039;t really count, or does it?</p>'
      format: basic_html
      summary: "This Sector General book tells the story of a gourmet chef, who eventually becomes the hospital's chief dietician, but not before some hilarious errors."
