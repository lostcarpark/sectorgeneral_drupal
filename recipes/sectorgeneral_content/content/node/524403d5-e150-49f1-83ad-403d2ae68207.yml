  body:
    -
      value: |-
        <p>Another notable retrtome from NESFA, who have done equally well by the likes of Charles L. Harness, Murray Leinster, and Eric Frank Russell. The contents are Tabled below. For now, however, I&#039;d like to quote part of Mike Resnick&#039;s witty Introduction:</p>
        <p>&quot;So why (I hear you ask) do I, who can most charitably be termed cynical, and whose endings are not always the happiest, have such admiration for James White? . . . First, because the man is a craftsman and an artist, and I have unbounded respect for both traits . . . And second, and perhaps more importantly, because while I may write about my universe, I wish I could live in his&quot; (p. 15). Click here to read Mike Resnick&#039;s introduction.</p>
        <p>Also, I can only nod in agreement with this extract from Walt Willis&#039;s &#039;James White&#039; tribute piece: &quot; . . . you were always a better person for reading a James White story. Without lecturing his readers, he always made clear what was the right way to behave in any circumstances, and why&quot; (p. 21).</p>
        <p>Fiction: &#039;Custom Fitting&#039;; &#039;Commuter&#039;; &#039;House Sitter&#039;; &#039;Sanctuary&#039;; &#039;Christmas Treason&#039;; &#039;The Secret History of Sector General&#039; (article: see under Non-Fiction); &#039;Accident&#039;; &#039;Medic&#039;; &#039;Countercharm&#039;; &#039;Visitor at Large&#039; (see under Short Stories).</p>
        <p>Fan Writing: &#039;An Introduction to Real Virtuality&#039; (by Bruce Pelz); &#039;The Last Time I Saw Harris&#039;; &#039;The Beacon&#039;; &#039;The Not-So-Hot Gospeller&#039;; &#039;The Long Afternoon of Harrowgate&#039;; &#039;The History of IF&#039;; &#039;The Quinze-y Report&#039;; &#039;Fester on the Fringe&#039;; &#039;The Exorcists of IF&#039;; &#039;The Unreal George Affair&#039; (see under Non-Fiction).</p>
        <p>More about Sector General: &#039;Sector General Timeline&#039; (Gary Louie); &#039;Notes on the Classification System&#039;; &#039;The Classification System&#039; (Gary Louie).</p>
      format: basic_html
      summary: 'To mark the appearance of James at LA con III Worldcon, as Guest of Honour. A selection of ten short stories and nine pieces of fan writing by James, including a timeline of Sector General, and a piece on the classification system that he used. Not forgetting the fantastic introductions by Walt Willis and Mike Resnick.'
