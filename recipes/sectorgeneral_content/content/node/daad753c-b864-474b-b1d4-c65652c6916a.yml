  body:
    -
      value: |-
        <p>The Interpreters (14pp) is a book only by editorial fiat of the Novacon 15 Committee. Therefore, I&#039;m going to be analytically retentive about it (but see under Short Stories). Langford&#039;s &#039;Outbreak&#039; parody (in A Novacon Garland) is, however, worthy of mention -- especially for lines like this representative sample: &quot;After a mildly awkward interlude (only the Tralthan cubicle was free, with a lavatory seat four feet across), Conway emerged... (p17). There is no truth to the rumour that Dustin Hoffman snapped up the film rights.</p>
        <p>First Publication:</p>
        <p>Novacon 15 booklet, 1985.</p>
        <p>Publication History:</p>
        <p>FANTASY &amp; SF, March 1987</p>
        <p>Back to Books Main Next: Star Healer</p>
      format: basic_html
      summary: "This chap-book is doubled with a David Langford Sector General parody. This was to coincide with their appearance as GOH's at Novacon that year."
