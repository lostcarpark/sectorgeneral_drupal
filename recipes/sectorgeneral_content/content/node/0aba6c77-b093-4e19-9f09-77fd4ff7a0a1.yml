  body:
    -
      value: '<p>‘Invader’ kicks off the Major Operation five-partwork novel. The thinkable unthinkable thought given utterance by O’Mara and Conway is that Senior Physician Mannen, grief-stricken over the recent death of his dog, has been making silly-billy mistakes through psychological negligence. But Mannen isn’t the only butterfingers (or worse) now aboard Sector General. “Some life form had entered the hospital. The invader was invisible and undetectable – even by the empathetic Cinrusskins – and it was creating hallucinations that were causing serious accidents . . . (blurb).</p>'
