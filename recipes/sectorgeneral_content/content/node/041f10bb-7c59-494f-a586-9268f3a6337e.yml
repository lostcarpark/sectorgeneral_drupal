    -
      value: '<p>It must have been one of the big colonial transports of the type which had carried four generation of colonists between the stars before the hyperdrive made such gargantuan ships obsolete, Conway though, as he stared at the great tear-drop shape framed in the direct vision port beside O&#039;Mara&#039;s desk.</p>'
