  body:
    -
      value: |-
        <p>&#039;Trouble with Emily&#039; is the second official Sector General short story to see print, and its also my personal favourite. Mainly, I confess, because of the dinosaur-alien named after one of the Brontë sisters -- Emily Brontosaurus. O&#039;Mara to Conway: &quot;I must say that I feel a pathological interest in a mind which thinks like that . . .&quot; Conway groans in sympathy. As did Bob Shaw, and every other member of the Belfast Science Fiction Group.</p>
        <p>First Published: NEW WORLDS No 77, November 1958</p>
        <p>Publishing History: Out of this World 2, Blackie and Sons, May 1961 Hospital Station (see under Books); Out of this World Choice Blackie, 1972, edited by Williams-Ellis/Owen.</p>
