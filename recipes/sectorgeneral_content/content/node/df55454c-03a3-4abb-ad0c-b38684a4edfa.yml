  body:
    -
      value: '<p>What starts as yet another journey into outer space becomes a Ballardian exploration of &#039;inner space&#039; (with added common sense). Lt. Commander George Adrian Surgenor, R. (S.)N. -- Royal (Space) Navy, no less -- acts as Radioman/Medical Officer aboard her Majesty&#039;s Space Vessel Mizar. He is, however, outraned only by the Ideal Captain -- and, believe you me, the clue really does lie in the title. This story should have been called The Ideal Captains . . . but I&#039;ve said too much already.</p>'
      format: basic_html
