  body:
    -
      value: "<p>Fix-up novel: 'Resident Physician' (see under Short Stories) and Field Hospital.&nbsp; The blurbster has it: \"Sector General is a mercy station -- a place where all kinds from all worlds are welcome.&nbsp; But for the first time, the hospital is threatened by creatures too different its purpose, and so powerful that they can cause utter havoc!\"&nbsp; The Etlan DBDG invaders take much the same attitude towards Sector Twelve General Hospital that Margaret Thatcher did to the British National Health Service.&nbsp; And, to paraphrase Chief Psychologist O'Mara, Dr Conway not only stops the war but also gets the girl (Nurse Murchison).</p>"
      format: basic_html
      summary: 'The second novel in the Sector General series. This book previously appeared as individual short stories.'
