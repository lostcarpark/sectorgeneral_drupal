  body:
    -
      value: "<p>A Best-of-the-Rest collection, with most of the stories harking back to the 1950s. Contents: &#039;Spacebird&#039;; &#039;Assisted passage&#039;; Curtain Call&#039;; &#039;Boarding Party&#039;; &#039;Patrol&#039;; &#039;Fast Trip&#039;; &#039;Question of Cruelaty&#039;; &#039;False Alarm&#039;; &#039;Dynasty of One&#039;/aka &#039;Long Will Live the King&#039;; &#039;Outrider&#039; (see under Short Stories).</p>\r\n<p>Graham Andrews</p>"
      format: basic_html
      summary: 'This is a selection of eleven short stories. The English edition from Orbit swopped the short story "Spacebird" for "Custom Fitting".'
