  field_opening_excerpt:
    -
      value: '<p>It was perhaps inevitable that when the long-awaited indication of intelligent at last appeared the majority of the ship’s observers were looking somewhere else, that it did not appear in the batteries of telescopes that were being trained on the surface or on the still and cine films being taken by Descartes’ planetary probes, but on the vessel’s close-approach radar screens.</p>'
