  body:
    -
      value: |-
        <p>Enter the Drambons*: a perpetual rolling-motion life form found on Meatball, the Invader’s home planet. These doughnut-shaped beings depend upon constant gravity feed for blood circulation. The Drambons might, or might not, have originated from the roll-along Martian omnibuses in Destiny’s Orbit (1941-42 and 1961), by David Grinell – always known to be Donald A. Wollheim.</p>
        <p>*Courtesy of Bob Shaw.</p>
