  body:
    -
      value: '<p>Sergeant McFall is Northern Ireland&#039;s answer to Sgt. Rock of Easy Company, jungle-fighting in a future Madagascar against Open Prison-type Bugs. Apart from the just-flown-in Lt. Nolan (Jim really liked that surname), McFall and his fellow patrol members are &quot;. . . veterans of this war, men who had no hope of winning it quickly because their enemy would not stand still and fight, and men who -- unlike the warriors of previous conflicts -- were hated rather than hero-worshipped by the civilians. Oh yes, a most frustrating war.&quot; Eat your heart out, Oliver Stone -- with fava beans.</p>'
      format: basic_html
