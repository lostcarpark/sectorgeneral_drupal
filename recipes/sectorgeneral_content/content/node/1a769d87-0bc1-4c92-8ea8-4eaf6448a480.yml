  body:
    -
      value: '<p>I&#039;m still not too sure whether &#039;Sector General&#039; is too short for its length or too long for its shortth. Jim himself ruefully admitted that John Carnell would have rejected the story in its present form if an upcoming issue of New Worlds hadn&#039;t sprung a 17,000-word hole. But it&#039;s worth reading just for this neat little first-contact scene: &quot;My name is O&#039;Mara, said the Major in a pleasant voice. &quot;I&#039;m the Chief Psychologist of this madhouse. You, I take it, are Dr Conway.&quot; O&#039;Mara smiles. Conway smiles in return, knowing that it looked forced, and that O&#039;Mara knew it also. Always start as you mean to go on . . .</p>'
      format: basic_html
