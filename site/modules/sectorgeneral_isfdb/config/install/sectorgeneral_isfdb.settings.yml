  'Orbit': 'Futura/Orbit, London'
  'Futura / Orbit': 'Futura/Orbit, London'
  'Macdonald': 'Macdonald, UK'
  'Orb': 'Orb (Tor Books)'
  'Tor': 'Tor Books'
